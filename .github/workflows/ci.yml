name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip draft PRs — only run when the PR is marked as ready
    # (github.event.pull_request.draft == false check via job-level if)

# Only keep the latest run per ref (PR ref or branch ref)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, linting, testing, and coverage enforcement
  ci:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Every test binary runs, even after one of them fails: cargo test is
      # fail-fast by default, so a single failure used to hide every binary
      # behind it. `continue-on-error` keeps the step from ending the job —
      # the last step below turns a red test run back into a red workflow.
      - name: Run tests (every binary, fail-late)
        id: tests
        continue-on-error: true
        run: cargo test --workspace --all-targets --no-fail-fast

      # `--ignore-run-fail` is cargo-llvm-cov's own way of doing the same:
      # it runs every test binary and *still* generates the report, exiting 0
      # when the tests failed. The report is therefore there to read on a red
      # run, which the old step — it aborted at the first failure — never was.
      - name: Coverage
        # Runs on a red test run; skipped only when an earlier step (fmt,
        # clippy) failed, where there is nothing to report.
        if: success() || steps.tests.outcome == 'failure'
        run: |
          echo '## 📊 Coverage Report' > coverage.txt
          echo '' >> coverage.txt
          echo '```' >> coverage.txt
          cargo llvm-cov --workspace --all-targets --ignore-run-fail --summary-only \
            --ignore-filename-regex 'crates/jyc-cli/src/main\.rs' >> coverage.txt
          echo '```' >> coverage.txt

      - name: Check coverage threshold
        if: success() || steps.tests.outcome == 'failure'
        run: |
          threshold=60
          pct=$(awk '/^TOTAL/ {gsub(/%/,"",$10); printf "%.0f", $10}' coverage.txt)
          echo "Line coverage: ${pct}%"
          if [ -z "${pct}" ]; then
            echo "❌ Could not parse coverage from coverage.txt"
            exit 1
          fi
          if [ "${pct}" -lt "${threshold}" ]; then
            echo "❌ Coverage ${pct}% is below ${threshold}% threshold"
            exit 1
          fi
          echo "✅ Coverage ${pct}% meets ${threshold}% threshold"

      - name: Ensure coverage file exists
        if: always()
        run: |
          if [ ! -f coverage.txt ]; then
            echo "⚠️ Coverage report not generated (previous step failed or was skipped)" > coverage.txt
          fi

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        # No PR context on push events — skip the comment step there
        if: always() && github.event_name == 'pull_request'
        with:
          path: coverage.txt

      # The test step above swallowed its failure on purpose, so that every
      # binary got to run and the coverage report still got written. This is
      # where that failure is paid back: the job ends red, with every failure
      # listed in the log of the step that found them.
      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed — every failure is listed in the 'Run tests' step above"
          exit 1
