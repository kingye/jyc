[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.3"
edition = "2024"

[workspace.dependencies]

[profile.dev]
debug = "line-tables-only"
opt-level = 1
split-debuginfo = "packed"
lto = false

[profile.release]
opt-level = "s"
# Fat LTO + a single codegen unit: whole-graph inlining and deduplication, paid
# for with release build time (the local gate stays on `cargo check`, so
# day-to-day work is unaffected). If release builds get too slow, drop
# `codegen-units` first and measure.
lto = "fat"
codegen-units = 1
strip = "symbols"
# Abort on panic: the shipped binary carries no landing pads nor panic-unwind
# tables of its own, worth 1.80 MB — 14.4% of the 12.49 MB it used to be. The
# trade is that a panic in any task ends the process instead of unwinding out of
# that task, so a deployment must restart it
# (docker `restart:`, systemd `Restart=`). Nothing in the tree catches a panic
# to keep going — the one `catch_unwind` in the dashboard's event forwarder was
# removed when this was turned on, and the dashboard's panic hook still restores
# the terminal before the abort, so a crash leaves a usable shell behind.
# `cargo test` is unaffected: Cargo ignores this setting for the test profile.
panic = "abort"
