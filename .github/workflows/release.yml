name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  workflow_dispatch:

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# release swap; the stable tag group prevents concurrent tag releases.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  JYC_VERSION: 0.9.0

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.JYC_RELEASE_PAT }}
      SOURCE_SHA: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      TARGET_TAG: nightly
      STAGING_TAG: nightly-staging
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      release_title: ${{ steps.prepare.outputs.release_title }}
      release_body: ${{ steps.prepare.outputs.release_body }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
    steps:
      - name: Prepare release metadata and draft
        id: prepare
        run: |
          set -euo pipefail

          delete_ref() {
            local tag="$1"
            if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${{ github.repository }}/git/ref/tags/$tag"
            fi
          }

          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
            TAG="${{ github.ref_name }}"
            RELEASE_TAG="$TAG"
            TITLE="Version $TAG"
            BODY="Automated release for $TAG."

            # Published version releases are immutable. A stale draft from an
            # earlier failed run may be replaced; a published one may not.
            if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "Release $TAG already exists; refusing to overwrite a published version release." >&2
                exit 1
              fi
              gh release delete "$TAG" --yes
            fi
            delete_ref "$TAG"
          else
            TAG="$TARGET_TAG"
            RELEASE_TAG="$STAGING_TAG"
            TITLE="Nightly"
            BODY="Automated nightly build from main."

            # Keep the published nightly available while the new build is
            # staged under a private draft tag.
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes
            fi
            delete_ref "$RELEASE_TAG"
          fi

          PRERELEASE_FLAG=()
          if [[ "$TAG" == "$TARGET_TAG" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes "$BODY" \
            --draft \
            "${PRERELEASE_FLAG[@]}"

          {
            echo "source_sha=$SOURCE_SHA"
            echo "release_title=$TITLE"
            echo "release_body=$BODY"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload (${{ matrix.runner }}, ${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    env:
      GITHUB_TOKEN: ${{ secrets.JYC_RELEASE_PAT }}
      SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-target-dir: false

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.runner }}" == macos-* ]]; then
            PLATFORM="aarch64-apple-darwin"
          else
            PLATFORM="${{ matrix.target }}"
          fi
          ARCHIVE_NAME="jyc-${{ env.JYC_VERSION }}-${PLATFORM}.tar.gz"
          CHECKSUM_NAME="${ARCHIVE_NAME}.sha256"
          tar -C "target/${{ matrix.target }}/release" -czf "$ARCHIVE_NAME" jyc
          shasum -a 256 "$ARCHIVE_NAME" > "$CHECKSUM_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=$CHECKSUM_NAME" >> "$GITHUB_ENV"

      - name: Upload archive directly to release draft
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE_NAME" "$CHECKSUM_NAME"

  plugin:
    name: Build and upload plugin archive
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.JYC_RELEASE_PAT }}
      SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-target-dir: false

      - name: Build plugin archive
        run: cargo xtask dist-plugin

      - name: Upload plugin archive directly to release draft
        run: gh release upload "$RELEASE_TAG" target/dist/jyc-plugin.tar.gz

  release:
    name: Publish release
    needs: [prepare-release, build, plugin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.JYC_RELEASE_PAT }}
      SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
      RELEASE_TITLE: ${{ needs.prepare-release.outputs.release_title }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
      TARGET_TAG: nightly
    steps:
      - name: Publish staged release
        run: |
          set -euo pipefail

          delete_ref() {
            local tag="$1"
            if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${{ github.repository }}/git/ref/tags/$tag"
            fi
          }

          if [[ "$RELEASE_TAG" == "$TARGET_TAG" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            # Every build job has uploaded successfully by this point. Replace
            # the published nightly only now so a failed build never removes
            # the last downloadable nightly.
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              gh release delete "$TARGET_TAG" --yes
            fi
            delete_ref "$TARGET_TAG"
            gh release edit "$RELEASE_TAG" \
              --tag "$TARGET_TAG" \
              --title "$RELEASE_TITLE" \
              --draft=false \
              --prerelease
          fi

  prune-artifacts:
    name: Prune old Actions artifacts
    needs: release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
