[package]
name = "jyc-bridge-feishu"
version.workspace = true
edition.workspace = true
description = "Feishu channel bridge for JYC — connects to jyc over WebSocket"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
