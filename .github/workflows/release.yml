name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  workflow_dispatch:

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# delete/recreate, and a version-tag release should not block on (or be
# blocked by) a nightly build.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    permissions:
      contents: write
    steps:
      # Create (or refresh) the release target before the matrix starts. Build
      # jobs upload their archives directly as release assets, so Release no
      # longer depends on Actions artifact storage.
      - name: Prepare release target
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'false'; then
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
            else
              if ! gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --verify-tag --draft --generate-notes
              fi
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Delete ALL existing nightly releases (including stale drafts) and
            # the tag, so the release can be recreated without hitting
            # "tag_name already_exists". gh release delete only removes the
            # single release the tag resolves to, leaving duplicate drafts.
            for id in $(gh api repos/${{ github.repository }}/releases \
              --jq '.[] | select(.tag_name=="nightly") | .id'); do
              gh api -X DELETE repos/${{ github.repository }}/releases/"$id" || true
            done
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/nightly || true

            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --draft --prerelease \
              --title "Nightly Build ($SOURCE_SHA)" \
              --notes "Automated nightly build from commit $SOURCE_SHA"
            {
              echo "release_tag=nightly"
              echo "publish_release=true"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binaries
        # jyc: agent core + TUI; jyc-pipe: peripheral channel pipe process
        # (pipe process split — docs/architecture/pipe-split.md).
        #
        # Two invocations on purpose: feature resolution is per-invocation, and
        # building both packages at once unifies their reqwest features, which
        # links the pipe's rustls backend into the hub binary. The hub uses
        # native-tls, the pipe keeps reqwest's rustls default.
        run: |
          cargo build --release -p jyc-cli --target ${{ matrix.target }}
          cargo build --release -p jyc-channels --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc jyc-pipe

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/jyc-${{ matrix.target }}.tar.gz"

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The plugin archive: the user-editable collections this repo ships, in
      # the layout `jyc plugins install` expects at an archive (or directory)
      # root. Built here rather than in `build`, so the matrix does not produce
      # it once per target. sync-gitee-release.yml mirrors it as well.
      - name: Package plugin archive
        run: |
          mkdir -p dist
          tar -czf dist/jyc-plugins.tar.gz skills subagents hooks templates

      - name: Upload plugin archive to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/jyc-plugins.tar.gz

      # Publishing (rather than merely uploading assets) is what triggers the
      # release:published event consumed by sync-gitee-release.yml.
      - name: Publish prepared release
        if: needs.prepare-release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  prune-artifacts:
    # Keep Actions artifacts for the latest five release tags. Release binaries
    # are GitHub Release assets, so this now applies to Docker build records;
    # GitHub Release assets are separate.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
