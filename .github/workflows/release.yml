name: Release

on:
  push:
    branches: [main]

# Serialize nightly releases - rapid pushes must not race delete/recreate
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binary
        run: cargo build --release -p jyc-cli --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyc-${{ matrix.target }}
          path: dist/jyc-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Delete the existing GitHub release (and its tag) so action-gh-release
      # creates a fresh release without encountering duplicate-release errors.
      - name: Delete existing nightly release
        run: gh release delete nightly --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (${{ github.sha }})
          prerelease: true
          files: dist/*.tar.gz
