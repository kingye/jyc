name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  workflow_dispatch:

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# delete/recreate, and a version-tag release should not block on (or be
# blocked by) a nightly build.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_tag: ${{ steps.release.outputs.target_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    permissions:
      contents: write
    steps:
      # Create (or refresh) the release target before the matrix starts. Build
      # jobs upload their archives directly as release assets, so Release no
      # longer depends on Actions artifact storage.
      - name: Prepare release target
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "target_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            IS_DRAFT="$(gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$IS_DRAFT" == "false" ]]; then
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
            else
              # Remove a stale draft (and duplicate draft records) before the
              # matrix uploads assets. Published version releases are handled
              # above and are never deleted.
              if [[ -n "$IS_DRAFT" ]]; then
                for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" \
                  --jq ".[] | select(.tag_name==\"$REF_NAME\") | .id"); do
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
                done
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$REF_NAME" || true
              fi
              gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --generate-notes
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Stage the new nightly privately. The published nightly stays
            # available until every asset has uploaded and the release job
            # swaps the tag below.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | select(.tag_name=="nightly-staging") | .id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-staging" || true

            gh release create nightly-staging --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --draft --prerelease \
              --title "Nightly Build ($SOURCE_SHA)" \
              --notes "Automated nightly build from commit $SOURCE_SHA"
            {
              echo "release_tag=nightly-staging"
              echo "target_tag=nightly"
              echo "source_sha=$SOURCE_SHA"
              echo "publish_release=true"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binaries
        # jyc: agent core + TUI; jyc-pipe: peripheral channel pipe process
        # (pipe process split — docs/architecture/pipe-split.md).
        #
        # Two invocations on purpose: feature resolution is per-invocation, and
        # building both packages at once unifies their reqwest features, which
        # links the pipe's rustls backend into the hub binary. The hub uses
        # native-tls, the pipe keeps reqwest's rustls default.
        run: |
          cargo build --release -p jyc-cli --target ${{ matrix.target }}
          cargo build --release -p jyc-channels --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc jyc-pipe

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/jyc-${{ matrix.target }}.tar.gz"

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The plugin archive: the user-editable collections this repo ships, in
      # the layout `jyc plugins install` expects at an archive (or directory)
      # root. Built here rather than in `build`, so the matrix does not produce
      # it once per target. sync-gitee-release.yml mirrors it as well.
      - name: Package plugin archive
        run: |
          mkdir -p dist
          tar -czf dist/jyc-plugins.tar.gz skills subagents hooks templates

      - name: Upload plugin archive to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/jyc-plugins.tar.gz

      # Move the fully uploaded staging draft onto the public nightly tag only
      # after every matrix and plugin upload has succeeded. Keep the previous
      # nightly release on a temporary tag until the new release is public so a
      # failed swap can be rolled back without losing the old assets.
      - name: Replace nightly release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          TARGET_TAG="nightly"
          BACKUP_TAG="nightly-previous-$GITHUB_RUN_ID"
          OLD_RELEASE_ID=""
          OLD_TAG_SHA=""
          ROLLBACK_DONE=false

          rollback() {
            local status=$?
            if [[ "$ROLLBACK_DONE" == "false" && -n "$OLD_RELEASE_ID" ]]; then
              ROLLBACK_DONE=true
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET_TAG" >/dev/null 2>&1 || true
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$TARGET_TAG" -f "sha=$OLD_TAG_SHA" >/dev/null 2>&1 || true
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
                -f "tag_name=$TARGET_TAG" >/dev/null 2>&1 || true
              echo "Rolled back the previous nightly release after the swap failed." >&2
            fi
            exit "$status"
          }
          trap rollback ERR

          OLD_RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" \
            --jq '.id' 2>/dev/null || true)"
          if [[ -n "$OLD_RELEASE_ID" ]]; then
            OLD_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" \
              --jq '.object.sha')"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$BACKUP_TAG" -f "sha=$OLD_TAG_SHA"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
              -f "tag_name=$BACKUP_TAG"
          fi

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET_TAG" || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TARGET_TAG" -f "sha=$SOURCE_SHA"

          STAGING_RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name=="'$RELEASE_TAG'") | .id' | head -n 1)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
            -f "tag_name=$TARGET_TAG" \
            -F "draft=false" \
            -F "prerelease=true"
          # The new nightly is public from here on. Cleanup failures must not
          # roll back onto the old release after the swap has committed.
          ROLLBACK_DONE=true

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
          if [[ -n "$OLD_RELEASE_ID" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$BACKUP_TAG" || true
          fi
          trap - ERR

      # Publishing (rather than merely uploading assets) is what triggers the
      # release:published event consumed by sync-gitee-release.yml. The nightly
      # swap above publishes its staged release directly.
      - name: Publish prepared release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  prune-artifacts:
    # Keep Actions artifacts for the latest five release tags. Release binaries
    # are GitHub Release assets, so this now applies to Docker build records;
    # GitHub Release assets are separate.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
