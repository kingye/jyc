name: Bloat

# Manual only: this is a diagnostic, not a gate. It answers "where did the
# binary's bytes go" when someone is about to pick the next size lever —
# dispatch it from the Actions tab (or `gh workflow run bloat.yml`) and read
# the per-crate table out of the log.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a second dispatch supersedes the first rather than
# competing for the same runner minutes.
concurrency:
  group: bloat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bloat:
    # Linux only — that is the target the deployed binary is built for.
    runs-on: ubuntu-22.04
    # Fat LTO + codegen-units = 1; a cold cache is the slow case.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          cache: false

      # Same prefix-key as release.yml's Linux job, so a dispatch reuses the
      # release build cache instead of paying a cold build (~4 min vs ~20).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-ubuntu-22.04"

      - name: Install protoc (Linux)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `uses: taiki-e/install-action@cargo-bloat` (tool name as the ref) does
      # not resolve: the runner looks `cargo-bloat` up as a git ref. Pass the
      # tool as an input and pin the action by version instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - name: Binary size as shipped
        # The stripped artifact release.yml ships — the number to compare with
        # `ls -l` on a deployed machine.
        run: |
          cargo build --release -p jyc-cli
          ls -l target/release/jyc

      - name: Per-section breakdown
        # cargo-bloat attributes .text only — 46.7% of the shipped file. The
        # other half (.rodata string tables, .data, .bss) is invisible there,
        # so size the sections of the artifact as shipped before picking a
        # lever. Must stay before the bloat step: that one relinks the binary
        # unstripped.
        run: |
          size target/release/jyc
          size -A target/release/jyc

      - name: Per-crate attribution
        # The same binary, kept unstripped: cargo-bloat attributes by symbol
        # table and the release profile's strip = "symbols" would leave it
        # nothing to read. Overridden through the environment so Cargo.toml
        # stays untouched and the cached rlibs still apply — only the final
        # link is redone.
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: cargo bloat --release -p jyc-cli --crates --top 40
