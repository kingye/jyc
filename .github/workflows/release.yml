name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# delete/recreate, and a version-tag release should not block on (or be
# blocked by) a nightly build.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binary
        run: cargo build --release -p jyc-cli --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyc-${{ matrix.target }}
          path: dist/jyc-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Version-tag push (e.g. `v0.3.14`): publish a stable release with the
      # tag name. The tag was pushed with the code, so it already exists;
      # action-gh-release creates the release for it (fails only if the
      # RELEASE already exists — tags are immutable and never re-published).
      - name: Publish stable release (version tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          token: ${{ secrets.RELEASE_PAT }}

      # Push to main: refresh the nightly pre-release.
      # Delete ALL existing nightly releases (including stale drafts) and the
      # tag, so action-gh-release creates a fresh release without hitting
      # "tag_name already_exists". gh release delete only removes the single
      # release the tag resolves to, leaving duplicate drafts behind.
      - name: Delete existing nightly release
        if: github.ref_type == 'branch'
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.tag_name=="nightly") | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/"$id" || true
          done
          gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/nightly || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (${{ github.sha }})
          prerelease: true
          files: dist/*.tar.gz
          # Use a PAT (not the default GITHUB_TOKEN) so the resulting
          # release:published event can trigger sync-gitee-release.yml.
          # Events from GITHUB_TOKEN don't trigger other workflows.
          token: ${{ secrets.RELEASE_PAT }}
