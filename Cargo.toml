[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.19"
edition = "2024"

[workspace.dependencies]

[profile.dev]
debug = "line-tables-only"
opt-level = 1
split-debuginfo = "packed"
lto = false

[profile.release]
opt-level = "s"
# Fat LTO + a single codegen unit: whole-graph inlining and deduplication, paid
# for with release build time (the local gate stays on `cargo check`, so
# day-to-day work is unaffected). If release builds get too slow, drop
# `codegen-units` first and measure.
lto = "fat"
codegen-units = 1
strip = "symbols"
# NOTE: panic stays "unwind" — jyc-inspect/src/server.rs uses
# AssertUnwindSafe(catch_unwind) for dashboard event-forwarding tasks.
