[package]
name = "jyc-bridge-feishu"
version.workspace = true
edition.workspace = true
description = "Feishu channel bridge for JYC — connects to jyc over WebSocket"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jyc-types = { path = "../../crates/jyc-types" }
jyc-utils = { path = "../../crates/jyc-utils" }
openlark-client = { version = "0.20", default-features = false, features = ["websocket"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
