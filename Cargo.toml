[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
libc = "0.2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
async-trait = "0.1"
glob = "0.3"
walkdir = "2"
arc-swap = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# IMAP
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = "0.5"

# Email parsing
mail-parser = "0.9"

# SMTP
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# Markdown <-> HTML
comrak = "0.37"
htmd = "0.5"

# SSE
reqwest-eventsource = "0.6"

# MCP
rmcp = { version = "1.3", features = ["server", "transport-io", "schemars"] }

# Feishu/Lark SDK
openlark = { version = "0.15.0-rc.2", default-features = false, features = ["auth", "communication", "websocket"] }

# TUI (Dashboard)
ratatui = "0.29"
crossterm = "0.28"

# Dev
tempfile = "3"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
[profile.dev.package."*"]
debug = 0
