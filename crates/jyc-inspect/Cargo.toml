[package]
name = "jyc-inspect"
version.workspace = true
edition = "2024"
description = "Runtime inspection server/client for JYC"

[dependencies]
jyc-types = { path = "../jyc-types" }
jyc-core = { path = "../jyc-core" }
jyc-utils = { path = "../jyc-utils" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
arc-swap = "1"
# axum-based HTTP server (promoted from transitive via jyc-channels)
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
# HTTP client used by the dashboard-side InspectClient
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# WebSocket upgrade (already used by the chat path)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"
# Constant-time token compare (auth middleware)
subtle = "2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
