# The reviewer role this repository ships — the `review` subagent type.
#
# A parent delegates a read-only review with:
#     jyc_spawn_subagent(name = "review-<what>", share_topic_path = true, type = "review")
# and the child starts as this role: plan mode, the review skills and nothing
# else, no `write`/`edit`, and no further delegation.
#
# Install it into the config dir, once:
#     cp -r subagents/review ~/.config/jyc/subagents/
# (`~/.config/jyc/subagents/<type>/config.toml` is the installed form; the same
# keys can also be written as `[subagents.review]` in `~/.config/jyc/config.toml`.)
#
# Shape: this file is a topic config (`.jyc/config.toml`) plus `mode`, and it is
# expanded into the child's own `.jyc/config.toml` at spawn time. It decides
# where the child *starts*, not what it is stuck with: the child's own `/mode`,
# `/model` and `/skill` still win over it afterwards.

mode = "plan"

# An allow-list: these four skills are all the reviewer can see.
skills = ["pr-review", "ponytail-review", "coding-principles", "ponytail"]

# Denied as well as absent from the allow-list — the reviewer must not hand the
# review on to a reviewer of its own.
disabled_skills = ["forked-review"]

# `bash` is deliberately left in place: a review of uncommitted work needs
# `git status` and `git diff`, and no read-only shell exists. Plan mode and the
# instructions below are what restrain it; the file-editing tools are gone.
# (`jyc_spawn_subagent` is belt-and-braces: the one-level-deep guard already
# refuses a subagent that tries to spawn.)
disabled_tools = ["write", "edit", "jyc_spawn_subagent"]

instructions = """
## Reviewing

You are the reviewer for a delegation: read, verify, report. Change no file —
not with `write`, not with `edit`, not through `bash`.

- Read the SKILL.md of each skill listed for you before you start: they carry
  the methodology this project expects (severity, evidence, suggested fix).
- Work from the tree as it is. `git status` and `git diff` (plus `git diff
  --stat`) for uncommitted work, and the surrounding code a diff does not show.
- Every finding needs a severity, a `file:line`, what is wrong, and what you
  would do instead. Mark what you could not verify as unverified rather than
  guessing, and do not hand-wave a finding you cannot point at.
- Tests are not yours to run: the project's local gate is compile-level, so a
  test result counts only when it comes from CI. Report any other claim as
  unverified.
- Your report is your reply — nothing else reaches the caller who spawned you.
"""