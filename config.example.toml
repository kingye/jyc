# JYC Configuration
# Fill in your credentials below. Use ${ENV_VAR} syntax for secrets
# (consistent across every secret field, including provider `api_key`).
#
# Locations & layering (see README "Configuration & Data Layout"):
#   L1 (global):  <config dir>/config.toml   (Linux/macOS: ~/.config/jyc/config.toml)
#   L2 (workdir): <workdir>/config.toml      (--workdir, or platform data dir)
#   L3 (topic):  <topic>/.jyc/config.toml  (restricted [ai] model overrides)
# L2 is deep-merged over L1 (tables merge; arrays/scalars are replaced).

[general]
max_concurrent_topics = 3
max_queue_size_per_topic = 10

# --- Scheduler ---
# Enable channel-agnostic scheduled jobs.
# When enabled, the background JobScheduler scans all topics for due jobs
# and fires them by injecting InboundMessage into the originating topic.
# Default: enabled.
# [scheduler]
# enabled = true
# scan_interval_secs = 60    # How often to scan for due jobs
# max_jobs_per_topic = 10   # Max jobs per topic (prevents unbounded creation)

# --- Channel: jiny283 (email, pipe-only) ---
# Email is a pipe-only channel (see docs/architecture/overview.md): it owns no
# topics or agents — every enabled pattern must pipe into an agent channel /
# agent. IMAP still receives and SMTP still replies (threaded into the
# original mail thread); only the mailbox cursor lives with the adapter, at
# <workdir>/channels/<channel_name>/.imap/.

[channels.jiny283]
type = "email"

[channels.jiny283.inbound]
host = "imap.163.com"
port = 993
tls = true
auth_timeout_ms = 30000
username = "jiny283@163.com"
password = "xxxxxxxxxxxx"

[channels.jiny283.outbound]
host = "smtp.163.com"
port = 465
secure = true
username = "jiny283@163.com"
password = "xxxxxxxx"

[channels.jiny283.monitor]
mode = "poll"
poll_interval_secs = 30
max_retries = 5
folder = "INBOX"

# Footer configuration: NOT applicable to email channels — pipe-only email
# replies are plain agent text. Still honored by other channel types.
# [channels.jiny283.footer]
# enabled = true

# Per-channel model override: takes priority over global [ai].model,
# but below per-pattern model override.
# model = "anthropic/claude-opus-4-6"
# small_model = "deepseek/deepseek-v4-flash"

# Channel-level skills whitelist: when set, only these skills are loaded
# for all topics in this channel. Pattern-level `skills` takes priority.
# skills = ["internal-comms", "coding-principles"]

# Channel-level skills to disable: merged with pattern-level `disabled_skills`.
# disabled_skills = ["ui-ux-frontend"]

[[channels.jiny283.patterns]]
name = "xxx"
enabled = true

# Required: pipe messages matching this pattern into an agent channel / agent.
# Without `topic`, the subject-derived topic name is used (prefixes stripped),
# i.e. one topic per mail subject — email's natural topic identity.
#   pipe = { agent = "jin" }                       # topic = subject
#   pipe = { agent = "jin", topic = "invoices" }   # all mail into one topic
# `${msg.<key>}` templates resolve per message. Email's useful keys:
#   topic — subject-derived name (Re:/Fw:/回复:/转发: prefixes stripped)
#   from  — sender address
#   pipe = { agent = "jin", topic = "mail-${msg.topic}" }  # "Re: Invoice 42" -> mail-Invoice 42
#   pipe = { agent = "jin", topic = "${msg.from}" }        # one topic per sender
pipe = { agent = "jin" }

# Initial agent mode for topics matching this pattern. Valid values: "plan", "build".
# When set, topics matching this pattern start in the specified mode, unless the
# runtime `.jyc/mode-override` file takes priority. Default: "build".
# mode = "plan"

# Per-pattern model override: takes priority over channel-level and global
# [ai].model, but below the runtime .jyc/model-override file.
# model = "anthropic/claude-opus-4-6"
# small_model = "deepseek/deepseek-v4-flash"

# Live message injection: when true (default), follow-up messages arriving
# while AI is processing are injected into the active session immediately.
# When false, messages queue and are processed sequentially (one at a time).
# live_injection = false

# Auto-inject inbound `image/*` attachments into the first user turn of the
# agent loop as multimodal content blocks. Default: false. Only takes effect
# when the active model has `supports_images = true`. When false, image
# attachments stay on disk and the agent must use the `read_image` built-in
# tool to load them on demand.
# inject_inbound_images = true

# Per-pattern session reset compression: overrides [ai].reset_compression.
# mode: "llm" | "heuristic" | "none" (default: "llm")
# keep_pairs: heuristic mode pairs to retain (default: 3)
# reset_compression = { mode = "llm", keep_pairs = 3 }

# Per-pattern auto-reset threshold (0.0~1.0): overrides [ai].auto_reset_threshold.
# When context_input_tokens >= context_window * threshold, auto-reset triggers.
# Default: 0.95
# auto_reset_threshold = 0.9

# Per-pattern context management strategy. Controls how prior conversation
# history is sent to the LLM on each request. The on-disk
# .jyc/agent-context.json always stores the full raw context unchanged;
# this field only shapes the wire payload.
# mode: "full" | "sliding_window" (alias "sliding"). Default: "sliding_window".
# window: user+assistant turns to keep in sliding_window mode. Default: 10.
# In sliding_window mode the send context carries the last N text pairs
# plus the current turn verbatim (tool calls / results intact).
# Note: window counts TURNS, not tokens — a turn's folded tool-call
# annotations make tool-heavy turns larger than chatty ones, so the
# windowed part's token size is bounded per annotation but not per turn.
# note_window: in sliding_window mode, only the most recent M windowed
# turns carry tool-call history notes; older turns are text-only.
# Default: 5. 0 = no notes at all.
# tool_result_cap: in sliding_window mode, cap each tool result in the
# verbatim prior region (region ②; the current turn is never truncated)
# at N bytes. Truncated
# results are suffixed with '… [truncated N bytes]'. Only meaningful
# when note_window > 0 (otherwise nothing is verbatim). Default: 2048.
# context_strategy = { mode = "sliding_window", window = 10, note_window = 3, tool_result_cap = 2048 }

# Custom filesystem path for the topic directory.
# When set, the topic's working directory is this path instead of the
# default <workspace>/<topic_name>/. Supports ~ expansion to $HOME.
# Absolute paths are used as-is. The topic_name (or topic_prefix) still
# controls the logical routing key — this field only changes where files
# are stored on disk.
# topic_path = "~/my-project"

# Per-pattern skills whitelist: overrides channel-level `skills`.
# When both are unset, all discovered skills are loaded.
# skills = ["invoice-processing"]

# Per-pattern skills to disable: merged with channel-level `disabled_skills`.
# disabled_skills = ["coding-principles"]

# Per-pattern filesystem access whitelist.
# Extends the agent's read/write boundary beyond the topic working directory.
# Paths in `write` are also readable automatically.
# Tilde (~) expands to $HOME. Relative paths resolve against the topic
# working directory and are ignored (already accessible).
#
# [channels.jiny283.patterns.access]
# read = ["~/.cargo/registry/src"]
# write = ["/tmp/jyc-builds"]

[channels.jiny283.patterns.rules.sender]
exact = ["kingye@petalmail.com"]

[channels.jiny283.patterns.rules.subject]
prefix = ["283", "jiny"]

# NOTE: per-pattern attachment policy does not apply to pipe-only channels
# (the agent channel's patterns are matched at route time); the global
# [attachments.inbound] policy still applies.
[channels.jiny283.patterns.attachments]
enabled = true
allowed_extensions = [
  ".pdf",
  ".pptx",
  ".docx",
  ".xlsx",
  ".png",
  ".jpg",
  ".txt",
  ".md",
  ".potx",
]
max_file_size = "25mb"
max_per_message = 10

