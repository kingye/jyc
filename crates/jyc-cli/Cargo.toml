[package]
name = "jyc-cli"
version.workspace = true
edition = "2024"
description = "CLI binary for the JYC AI agent framework"

[[bin]]
name = "jyc"
path = "src/main.rs"

[dependencies]
jyc-types = { path = "../jyc-types" }
jyc-utils = { path = "../jyc-utils" }
jyc-core = { path = "../jyc-core" }
jyc-inspect = { path = "../jyc-inspect" }
jyc-agent = { path = "../jyc-agent" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
ratatui = "0.30"
# `default-features = false` drops `highlight-code`, and with it syntect,
# onig/onig_sys (a C library linked in) and plist — several MB of the jyc
# binary. Code blocks render as plain text in the default stylesheet.
tui-markdown = { version = "0.3.9", default-features = false }
# `osc52` = the clipboard escape the chat pane's yank keys send (see `chat::clipboard`)
crossterm = { version = "0.29", features = ["osc52"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
arc-swap = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
unicode-width = "0.2"
tempfile = "3"
ratatui-textarea = "0.9.2"
libc = "0.2"
# A plugin archive is a gzipped tar: `tar` reads the archive, `flate2` the gzip around it
tar = "0.4"
flate2 = "1"
