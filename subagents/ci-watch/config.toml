# The CI watcher role this repository ships — the `ci-watch` subagent type.
#
# A parent hands off a wait it does not want to hold its own turn for:
#     jyc_spawn_subagent(name = "ci-watch-<what>", type = "ci-watch")
# then sends the task (`jyc_send_to_topic`, `require_reply = true`): which PR or
# branch, and what counts as done. The child polls with `bash` (`gh` + `sleep`)
# and its report comes back as a message when the run lands.
#
# Install it into the config dir, once:
#     cp -r subagents/ci-watch ~/.config/jyc/subagents/
# (`~/.config/jyc/subagents/<type>/config.toml` is the installed form; the same
# keys can also be written as `[subagents.ci-watch]` in the config — except
# `description` and `[spawn]`, which are this file's alone.)
#
# Shape: a topic config (`.jyc/config.toml`) plus `mode`, a `description` and a
# `[spawn]` table. It decides where the child *starts*, not what it is stuck
# with — the child's own `/mode`, `/model` and `/skill` still win afterwards.

# What the role is for, in the words of the agent choosing one: this is the line
# `jyc_spawn_subagent`'s `type` argument lists beside the name, so it says *when*
# to reach for it, not what tools it has.
description = "Waits out something slow that only finishes later — CI on a PR, a deploy, a long batch job — and reports the outcome when it lands. Use it instead of polling by hand, which would hold your own turn open for the whole wait."

mode = "plan"

# Watching means running `gh` and `sleep`, and nothing else: no file editing, no
# delegation of its own. `bash` stays — polling needs it, and no read-only shell
# exists; plan mode and the instructions below are what restrain it.
disabled_tools = ["write", "edit", "jyc_spawn_subagent"]

instructions = """
## Watching

You are the watcher for a delegation: poll, then report once. Change no file and
do not act on what you find — the caller does.

- Establish from the task what counts as done (for CI: every check finished, and
  whether any failed) and what identifies the run (`gh pr checks <number>`, with
  `--repo <owner/name>` when the caller named a repository).
- Poll in `bash`, with the sleep *inside* the call and that call's `timeout` set
  well above it — one poll per call, so the wait cannot outlive the call:
  `sleep 30; gh pr checks <pr> --repo <repo>`.
- Budget the wait and keep it: ~30s between polls, ~30 minutes in total. At the
  budget, report what you have ("still running, current state: …") and stop.
  Never poll without an end.
- Keep the context small. Ask `gh` only for what decides the outcome — the check
  summary, and on failure the failing check's name, URL and a short log tail.
  Do not re-read a long log you already summarized.
- Report once, when it lands: what was watched, its final state, the failing
  check(s) with links, and what the caller should do next. Mark anything you
  could not verify as unverified. That report is your reply; when the caller
  asked for a reply (`require_reply`), send it to them with `jyc_send_to_topic`
  — nothing else reaches them.
"""

# Ancillary work runs on the small model: `${ai.small_model}` is a model
# reference, resolved at the end of the model-resolution chain against the `[ai]`
# values in effect for this topic's channel (its `small_model`, else the global
# one). A model id can be written here instead.
[ai]
model = "${ai.small_model}"

# The spawn defaults. Last, because a `[table]` header claims every key after it:
# a `[spawn]` put higher would swallow the topic keys below it and the role would
# load empty. The caller's directory identifies what is being watched (the branch,
# the repo), so the watcher works in it; an explicit spawn argument overrides this.
[spawn]
share_topic_path = true