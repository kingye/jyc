services:
  # Hub: agent core, websocket channel, inspect server. `jyc-pipe` below
  # reuses this definition through the anchor.
  jyc: &jyc-base
    image: jyc:${JYC_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: full
    network_mode: host
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      # Sync timezone with host
      - /etc/localtime:/etc/localtime:ro
      - ${ADDITIONAL_DATA_DIR:-/root/additional-data}:/root/additional-data

      # JYC data directory (config.toml, .env, channels, workspace)
      - ${JYC_DATA_DIR:-./}:/opt/jyc

      # Git/GitHub credentials
      - ${JYC_DATA_DIR}/.netrc:/root/.netrc
      - ${JYC_DATA_DIR}/gh_hosts.yml:/root/.config/gh/hosts.yml

      # SSH keys (read-only); configure SSH_DIR in .env
      - ${SSH_DIR:-~/.ssh}:/root/.ssh:ro
    restart: unless-stopped

  # Peripheral pipe process: hosts every pipe-only channel adapter
  # (feishu, github, gitee, wecom_bot, wecom, wecomkf, email) and connects
  # to the hub's websocket. It reuses the hub service definition verbatim
  # (same image, config, data directory and credentials — the pipe needs the
  # inspect auth token and the channel state, e.g. the IMAP mailbox cursor),
  # overriding only the binary. Restart ordering does not matter: the pipe
  # reconnects with backoff.
  jyc-pipe:
    <<: *jyc-base
    entrypoint: ["jyc-pipe"]
