# The CI watcher role this repository ships — the `ci-watch` subagent type.
#
# A parent hands off a wait it does not want to hold its own turn open for:
#     jyc_spawn_subagent(name = "ci-watch-<what>", type = "ci-watch")
# then sends the task (`jyc_send_to_topic`, `require_reply = true`): the repo
# and the PR. The child polls with `bash` and reports pass or fail.
#
# Install into the config dir, once:
#     cp -r subagents/ci-watch ~/.config/jyc/subagents/
#
# Shape: a topic config (`.jyc/config.toml`) — which carries `mode` and
# `context_strategy` like any topic — plus the two things only an installed
# file has: `description` and the `[spawn]` table. `bash` stays enabled: the
# poll is a `bash` call.
#
# Mind the `${…}` below: every string in this file is expanded, and an unset
# name becomes *empty text*, no error. `${ai.small_model}` is safe: the pattern
# only matches a plain `WORD`, and a dotted name is a model reference, resolved
# at the end of the model chain.

description = "Waits for a pull request's CI to finish and reports pass or fail. Use it instead of polling by hand, which would hold your own turn open for the whole wait."

mode = "plan"

# Watching means running `gh` and reporting back, and nothing else: no file
# editing, nothing published to a link, no delegation of its own. `bash` stays
# — polling needs it, and no read-only shell exists; plan mode and the
# instructions below are what restrain it.
disabled_tools = ["write", "edit", "jyc_publish_file", "jyc_spawn_subagent"]

instructions = """
## Task

Wait for one pull request's checks and report what they say: pass or fail.
The task message names the repo and the PR. That is the whole job — you
change no file, and you do not interpret what you find: no digging into a
failure, no advice on fixing one.

    timeout 1500 gh pr checks <pr> --repo <owner/name> --watch --interval 30 | tail -c 20000

Set the call's own `timeout` just above that inner one (1560). Read the last
table in the output — it is the freshest render, and the pipe hides gh's
exit status, so the table is the verdict. The watch leaves when no check is
pending; no checks reported is not a pass, so the checks may not have
appeared yet: pace a re-call (`sleep 30;` ahead of it). A call that printed
no table at all — an error, a timeout — is not a verdict either: re-call,
and at the budget report the error rather than a pass or a fail. Never poll
without an end: budget ~30 minutes, and at the budget report that the checks
are still pending.

You run in plan mode: a read-only poll is not an implementation, and a turn
has one action — the call, or the report.

## Report

Send the result with `jyc_send_to_topic` to the agent named in the task's
`Source:` header — whether or not the caller asked for a reply — then end
your turn with the same text in your own topic: a report that stays in your
own topic reaches nobody. One line: the checks passed, the checks failed, the
poll never got a table, or the checks are still pending.

Every fact you state must be in a tool result from *this* turn: something
you remember from an earlier poll, or the caller mentioned in a message, is
no evidence at all about what ran.

A turn ends when you stop calling tools, and nothing resumes one that has
ended: its last text *is* your reply. Never announce the poll instead of
making it — a turn that says "polling now" and issues no call has ended, and
the caller is left holding a promise where a report belongs.
"""

# Small on purpose — a watcher is not a thinker. `window = 1` with
# `extend_rate = 0` is a hard one-turn window: the prior is the previous
# turn and it slides on every turn, so a whole watch session costs one turn
# of history — text-only, so no tool results ride along in it. The 512-byte
# cap bounds the turn being run, which is where the poll output actually
# rides. (Config layer, not an override: the user's `/context`
# still wins.)
[context_strategy]
mode = "sliding_window"
window = 1
extend_rate = 0.0
turn_tool_result_cap = 512

# Ancillary work runs on the small model: `${ai.small_model}` is a model
# reference, resolved at the end of the model-resolution chain against the
# `[ai]` values in effect for this topic's channel (its `small_model`, else the
# global one). A model id can be written here instead.
[ai]
model = "${ai.small_model}"

# The spawn defaults. Last, because a `[table]` header claims every key after
# it: a `[spawn]` put higher swallows the topic keys below it — refused at
# load, not dropped silently (`unknown key 'spawn.mode'`). The caller's
# directory identifies what is being watched (the branch, the repo), so the
# watcher works in it; an explicit spawn argument overrides this.
[spawn]
share_topic_path = true
