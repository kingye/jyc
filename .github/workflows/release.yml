name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  workflow_dispatch:

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# delete/recreate, and a version-tag release should not block on (or be
# blocked by) a nightly build.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_tag: ${{ steps.release.outputs.target_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    permissions:
      contents: write
    steps:
      # Create (or refresh) the release target before the matrix starts. Build
      # jobs upload their archives directly as release assets, so Release no
      # longer depends on Actions artifact storage.
      - name: Prepare release target
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api_ref_sha() {
            local tag_name=$1
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.sha' 2>/dev/null
          }

          delete_ref_if_present() {
            local tag_name=$1
            local ref_sha
            if ref_sha="$(api_ref_sha "$tag_name")"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag_name"
            fi
          }

          set_ref() {
            local tag_name=$1
            local sha=$2
            local ref_sha
            if ref_sha="$(api_ref_sha "$tag_name")"; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag_name" \
                -f "sha=$sha" \
                -F force=true
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag_name" \
                -f "sha=$sha"
            fi
          }

          delete_draft_releases() {
            local tag_name=$1
            local release_ids
            release_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag_name\" and .draft == true) | .id")"
            if [[ -n "$release_ids" ]]; then
              while IFS= read -r release_id; do
                [[ -n "$release_id" ]] || continue
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              done <<< "$release_ids"
            fi
          }

          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "target_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

            # Inspect every release record for this tag. A single published
            # release wins, even if stale drafts also exist.
            PUBLISHED_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$REF_NAME\" and .draft == false) | .id" | wc -l)"
            if [[ "$PUBLISHED_COUNT" -gt 0 ]]; then
              echo "This release is already published; refusing to overwrite it." >&2
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            delete_draft_releases "$REF_NAME"
            delete_ref_if_present "$REF_NAME"
            set_ref "$REF_NAME" "$SOURCE_SHA"
            gh release create "$REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$REF_NAME" \
              --generate-notes \
              --draft \
              --verify-tag
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "release_tag=nightly-staging"
              echo "target_tag=nightly"
              echo "source_sha=$SOURCE_SHA"
              echo "publish_release=true"
            } >> "$GITHUB_OUTPUT"

            PUBLISHED_NIGHTLY_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.tag_name == "nightly" and .draft == false) | .id' | wc -l)"
            PUBLISHED_STAGING_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.tag_name == "nightly-staging" and .draft == false) | .id' | wc -l)"
            if [[ "$PUBLISHED_NIGHTLY_COUNT" -gt 1 || "$PUBLISHED_STAGING_COUNT" -gt 0 ]]; then
              echo "Ambiguous or unexpected published nightly releases; refusing to continue." >&2
              exit 1
            fi

            # Remove only draft leftovers from failed attempts. The published
            # nightly release and tag remain available until the final swap.
            delete_draft_releases "nightly-staging"
            delete_draft_releases "nightly"
            delete_ref_if_present "nightly-staging"
            set_ref "nightly-staging" "$SOURCE_SHA"
            gh release create nightly-staging \
              --repo "$GITHUB_REPOSITORY" \
              --title nightly \
              --generate-notes \
              --draft \
              --prerelease \
              --verify-tag
            STAGING_RELEASE_ID="$(gh release view nightly-staging \
              --repo "$GITHUB_REPOSITORY" \
              --json id \
              --jq '.id')"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
              -f "target_commitish=$SOURCE_SHA"
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binaries
        # jyc: agent core + TUI; jyc-pipe: peripheral channel pipe process
        # (pipe process split — docs/architecture/pipe-split.md).
        #
        # Two invocations on purpose: feature resolution is per-invocation, and
        # building both packages at once unifies their reqwest features, which
        # links the pipe's rustls backend into the hub binary. The hub uses
        # native-tls, the pipe keeps reqwest's rustls default.
        run: |
          cargo build --release -p jyc-cli --target ${{ matrix.target }}
          cargo build --release -p jyc-channels --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc jyc-pipe

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/jyc-${{ matrix.target }}.tar.gz"

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The plugin archive: the user-editable collections this repo ships, in
      # the layout `jyc plugins install` expects at an archive (or directory)
      # root. Built here rather than in `build`, so the matrix does not produce
      # it once per target. sync-gitee-release.yml mirrors it as well.
      - name: Package plugin archive
        run: |
          mkdir -p dist
          tar -czf dist/jyc-plugins.tar.gz skills subagents hooks templates

      - name: Upload plugin archive to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/jyc-plugins.tar.gz

      # Move the fully uploaded staging draft onto the public nightly tag only
      # after every matrix and plugin upload has succeeded. The underlying tag
      # must move too: release edits do not retarget an existing tag. Keep the
      # previous release and tag SHA under the existing staging tag until the
      # new public nightly has been verified.
      - name: Replace nightly release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          TARGET_TAG="nightly"
          TEMP_RELEASE_TAG="nightly-previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TEMP_MOVED=false
          OLD_RELEASE_ID=""
          OLD_MOVED=false
          OLD_TARGET=""
          OLD_REF_SHA=""

          release_records() {
            local tag_name=$1
            local is_draft=$2
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag_name\" and .draft == $is_draft) | [.id, .target_commitish] | @tsv"
          }

          record_count() {
            local records=$1
            local count=0
            local record
            while IFS= read -r record; do
              [[ -n "$record" ]] && count=$((count + 1))
            done <<< "$records"
            echo "$count"
          }

          set_ref() {
            local tag_name=$1
            local sha=$2
            local ref_sha
            if ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.sha' 2>/dev/null)"; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag_name" \
                -f "sha=$sha" \
                -F force=true
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag_name" \
                -f "sha=$sha"
            fi
          }

          rollback() {
            local status=$?
            trap - ERR
            echo "Nightly swap failed; rolling back to the previous release" >&2
            # Return the staged/new release to the existing staging tag before
            # restoring the old public release. The temporary release tag is a
            # release name only; no backup Git ref is created.
            if [[ "$TEMP_MOVED" == "true" && -n "$STAGING_RELEASE_ID" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
                -f "tag_name=$RELEASE_TAG" \
                -f "target_commitish=$SOURCE_SHA" \
                -F "draft=true" \
                -F "prerelease=true" || \
                echo "Warning: failed to return new release $STAGING_RELEASE_ID to staging" >&2
            fi
            if [[ "$OLD_MOVED" == "true" && -n "$OLD_RELEASE_ID" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
                -f "tag_name=$TARGET_TAG" \
                -f "target_commitish=$OLD_TARGET" \
                -F "draft=false" \
                -F "prerelease=true" || \
                echo "Warning: failed to restore release $OLD_RELEASE_ID to $TARGET_TAG" >&2
            fi
            if [[ -n "$OLD_REF_SHA" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET_TAG" \
                -f "sha=$OLD_REF_SHA" \
                -F force=true || \
                echo "Warning: failed to restore $TARGET_TAG to $OLD_REF_SHA" >&2
            fi
            exit "$status"
          }
          trap rollback ERR

          STAGING_RECORDS="$(release_records "$RELEASE_TAG" true)"
          if [[ "$(record_count "$STAGING_RECORDS")" -ne 1 ]]; then
            echo "Expected exactly one draft staging release for $RELEASE_TAG" >&2
            exit 1
          fi
          IFS=$'\t' read -r STAGING_RELEASE_ID STAGING_TARGET <<< "$STAGING_RECORDS"
          if [[ -z "$STAGING_RELEASE_ID" || -z "$STAGING_TARGET" ]]; then
            echo "Incomplete staging release record for $RELEASE_TAG" >&2
            exit 1
          fi

          OLD_RECORDS="$(release_records "$TARGET_TAG" false)"
          OLD_COUNT="$(record_count "$OLD_RECORDS")"
          if [[ "$OLD_COUNT" -gt 1 ]]; then
            echo "Ambiguous published $TARGET_TAG releases; refusing to swap" >&2
            exit 1
          elif [[ "$OLD_COUNT" -eq 1 ]]; then
            IFS=$'\t' read -r OLD_RELEASE_ID OLD_TARGET <<< "$OLD_RECORDS"
            if [[ -z "$OLD_RELEASE_ID" || -z "$OLD_TARGET" ]]; then
              echo "Incomplete previous $TARGET_TAG release record" >&2
              exit 1
            fi
            if ! OLD_REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" --jq '.object.sha' 2>/dev/null)"; then
              echo "Published release $OLD_RELEASE_ID has no $TARGET_TAG tag ref; refusing to swap" >&2
              exit 1
            fi

            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
              -f "tag_name=$TEMP_RELEASE_TAG" \
              -f "target_commitish=$SOURCE_SHA" \
              -F "draft=true" \
              -F "prerelease=true"
            TEMP_MOVED=true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
              -f "tag_name=$RELEASE_TAG" \
              -F "draft=false" \
              -F "prerelease=true"
            OLD_MOVED=true
          fi

          set_ref "$TARGET_TAG" "$SOURCE_SHA"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
            -f "tag_name=$TARGET_TAG" \
            -f "target_commitish=$SOURCE_SHA" \
            -F "draft=true" \
            -F "prerelease=true"

          NEW_RECORDS="$(release_records "$TARGET_TAG" true)"
          if [[ "$(record_count "$NEW_RECORDS")" -ne 1 ]]; then
            echo "Retargeted $TARGET_TAG draft failed verification" >&2
            exit 1
          fi
          IFS=$'\t' read -r NEW_RELEASE_ID NEW_TARGET <<< "$NEW_RECORDS"
          if ! NEW_REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TARGET_TAG" --jq '.object.sha' 2>/dev/null)"; then
            echo "Retargeted $TARGET_TAG draft has no tag ref" >&2
            exit 1
          fi
          if [[ "$NEW_RELEASE_ID" != "$STAGING_RELEASE_ID" || \
                "$NEW_TARGET" != "$SOURCE_SHA" || \
                "$NEW_REF_SHA" != "$SOURCE_SHA" ]]; then
            echo "Retargeted $TARGET_TAG draft metadata or tag SHA failed verification" >&2
            exit 1
          fi

          # Every check above ran while the release was still a draft, so no
          # release:published event has been emitted yet. This patch is the
          # first public event visible to sync-gitee-release.yml.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
            -F "draft=false"
          trap - ERR

          # Cleanup is best-effort after the new public nightly is verified.
          if [[ "$OLD_MOVED" == "true" && -n "$OLD_RELEASE_ID" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" || \
              echo "Warning: failed to delete previous release $OLD_RELEASE_ID" >&2
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true

      # Publishing (rather than merely uploading assets) is what triggers the
      # release:published event consumed by sync-gitee-release.yml. The nightly
      # swap above publishes its staged release directly.
      - name: Publish prepared release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  prune-artifacts:
    # Keep Actions artifacts for the latest five release tags. Release binaries
    # are GitHub Release assets, so this now applies to Docker build records;
    # GitHub Release assets are separate.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
