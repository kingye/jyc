name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip draft PRs — only run when the PR is marked as ready
    # (github.event.pull_request.draft == false check via job-level if)

# Only keep the latest run per ref (PR ref or branch ref)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mold replaces the runner's default linker (GNU ld) for the test step's
  # link phase — the slowest part of the job. The linker is a CI-only
  # concern: the build itself does not change.
  #
  # This has to stay at workflow level, not on the test step: cargo hashes
  # RUSTFLAGS into every unit's fingerprint, so the flag invalidates the
  # cached artifacts. rust-cache can only see RUST* env vars that are in its
  # own process environment — a step-scoped one is invisible to it, so the
  # cache would keep restoring the pre-mold artifacts, and every run would
  # recompile all dependencies without ever storing the new ones.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  # Formatting, linting, testing, and coverage enforcement
  ci:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install protoc and mold
        # mold is the linker the test step uses (see RUSTFLAGS above); it
        # comes from noble/universe, so this step is what fails if the
        # archive ever drops it.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mold

      - name: Install cargo-llvm-cov
        # Pinned: the workflow leans on the exit code of the test run
        # (--no-report without --ignore-run-fail), so a new release must not
        # change that silently.
        #
        # The binary survives between runs in rust-cache's cargo-bin cache
        # ($CARGO_HOME/bin), so on a warm cache the version already matches
        # and there is nothing to install. A cold cache compiles it from
        # source — that is the price of the pin.
        # `--force`: without it cargo refuses to overwrite a binary it does
        # not know about (one restored without its tracking metadata), and
        # that refusal would fail the step.
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -qE '^cargo-llvm-cov 0\.9\.1$'; then
            cargo install --force cargo-llvm-cov --version 0.9.1
          fi

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite runs once, instrumented: the same run leaves the data the
      # report is built from, so nothing is run twice. Two flags give the run
      # the shape #972 asked for:
      #   --no-fail-fast  every binary runs, even after one of them fails —
      #                   cargo test is fail-fast by default, so a single
      #                   failure used to hide every binary behind it
      #   --no-report    the report is the next step, built from the data
      #                   this run leaves behind, so a red *test* run still
      #                   has one — a build that does not compile leaves no
      #                   data at all, and the report step is red then too
      # `continue-on-error` keeps the step from ending the job — the last
      # step below turns a red test run back into a red workflow.
      - name: Run tests (every binary, fail-late)
        id: tests
        continue-on-error: true
        # The linker choice (mold) comes from the workflow-level RUSTFLAGS
        # above. cargo-llvm-cov 0.9.1 runs in its rustc-wrapper mode, which
        # leaves RUSTFLAGS alone and appends its own instrumentation flags
        # to the rustc command line — so the linker choice survives into the
        # inner cargo call. (With --no-rustc-wrapper it overwrites RUSTFLAGS
        # instead, and the linker choice would silently stop applying.)
        run: cargo llvm-cov --workspace --all-targets --no-report --no-fail-fast

      # The report comes from the run above, not from a second run of the
      # suite: `cargo llvm-cov report` reads the coverage data that run left
      # behind. It is therefore there on a red test run too — the step this
      # one replaced (the pre-#972 one) aborted at the first failure and
      # never had a report at all.
      - name: Coverage
        # Runs on a red test run: `continue-on-error` leaves the test step's
        # conclusion at success, so `success()` is still true. Skipped only
        # when an earlier step (fmt, clippy) failed, where there is nothing
        # to report.
        if: success()
        run: |
          echo '## 📊 Coverage Report' > coverage.txt
          echo '' >> coverage.txt
          echo '```' >> coverage.txt
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'crates/jyc-cli/src/main\.rs' >> coverage.txt
          echo '```' >> coverage.txt

      - name: Check coverage threshold
        if: success()
        run: |
          threshold=60
          pct=$(awk '/^TOTAL/ {gsub(/%/,"",$10); printf "%.0f", $10}' coverage.txt)
          echo "Line coverage: ${pct}%"
          if [ -z "${pct}" ]; then
            echo "❌ Could not parse coverage from coverage.txt"
            exit 1
          fi
          if [ "${pct}" -lt "${threshold}" ]; then
            echo "❌ Coverage ${pct}% is below ${threshold}% threshold"
            exit 1
          fi
          echo "✅ Coverage ${pct}% meets ${threshold}% threshold"

      - name: Ensure coverage file exists
        # `!cancelled()` and not `always()`: a run this workflow cancelled must
        # not write a placeholder report either — the same rule the test
        # failure step below follows.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f coverage.txt ]; then
            echo "⚠️ Coverage report not generated (previous step failed or was skipped)" > coverage.txt
          fi

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        # No PR context on push events — skip the comment step there
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          path: coverage.txt

      # The test step above swallowed its failure on purpose, so that every
      # binary got to run and the coverage report still got written. This is
      # where that failure is paid back: the job ends red, with every failure
      # listed in the log of the step that found them.
      - name: Fail if tests failed
        # `!cancelled()` and not `always()`: a run this workflow cancelled
        # (concurrency: cancel-in-progress) must not report a test failure it
        # never saw.
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: |
          echo "::error::Tests failed — every failure is listed in the 'Run tests' step above"
          exit 1
