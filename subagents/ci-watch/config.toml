# The CI watcher role this repository ships — the `ci-watch` subagent type.
#
# A parent hands off a wait it does not want to hold its own turn for:
#     jyc_spawn_subagent(name = "ci-watch-<what>", type = "ci-watch")
# then sends the task (`jyc_send_to_topic`, `require_reply = true`): the repo
# and the PR. The child polls with `bash` and reports pass or fail.
#
# Install into the config dir, once:
#     cp -r subagents/ci-watch ~/.config/jyc/subagents/
#
# Shape: a topic config (`.jyc/config.toml`) plus `mode`, a `description`,
# and two spawn-only keys (`context_strategy`, `[spawn]`) — a role, in the
# terms of the docs. `bash` stays enabled: the poll is a `bash` call.

description = "Waits for a pull request's CI to finish and reports pass or fail. Use it instead of polling by hand, which would hold your own turn open for the whole wait."

mode = "plan"

# No file editing, nothing published, no prompts: the poll is one `bash` call
# and the report is one `jyc_send_to_topic`. (Kept listed: reply-drafting
# tools — the report has to reach the parent somehow — and job tools —
# schedule-as-backstop is plausible even though the instructions lean on the
# inner timeout instead.)
disabled_tools = ["edit", "write", "job_create", "job_delete", "job_toggle", "jyc_publish_file", "jyc_spawn_subagent", "jyc_send_message"]

instructions = """
## Task

Wait for one pull request's checks to finish and report pass or fail. The
task message names the repo and the PR. That is the whole job — no digging
into a failure, no advice on fixing one.

    timeout 1500 gh pr checks <pr> --repo <owner/name> --watch --interval 30 | tail -c 20000

Set the call's timeout to 1560. The last table in the output is the verdict
(the pipe hides gh's exit code). If gh says no checks reported, `sleep 30`
and call again, up to about 30 minutes.

## Report

Send one line with `jyc_send_to_topic` to the agent named in the task's
`Source:` header — the checks passed, or the checks failed — then end your
turn. Your last message is the report: never announce the poll instead of
making the call.
"""

[context_strategy]
keep = 30_000
# Watcher results are short (pass/fail), but several polls' retries and the
# task message should stay in the sliding window.

[ai]
# A watcher must not carry the parent topic's runtime overrides into its own
# config — its `[ai]` gets dropped and the parent's per-mode model snapshot
# fills `model-override` instead.
note_window = 50_000
tool_result_cap = 30_000

# Must stay the LAST key of this file: the `jyc spawn` merge reads
# `[context_strategy]` as a marker for "below this line is spawn state, do
# not copy into the child" — a nested table after a later key would be lost.
[spawn]
