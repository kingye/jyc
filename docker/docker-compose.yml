services:
  # Hub: agent core, websocket channel, inspect server — and the parent of the
  # peripheral pipe process. The image's default command is
  # `jyc serve --debug --pipe`: `--pipe` spawns `jyc-pipe` as a child of the
  # hub, which hosts every pipe-only channel adapter (feishu, github, gitee,
  # wecom, wecom_bot, wecomkf, email) — channels the hub skips in-process. The
  # child reconnects to the hub with backoff, so start order does not matter,
  # and it is stopped together with the hub.
  jyc:
    image: jyc:${JYC_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: full
    network_mode: host
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      # Sync timezone with host
      - /etc/localtime:/etc/localtime:ro
      - ${ADDITIONAL_DATA_DIR:-/root/additional-data}:/root/additional-data

      # JYC data directory (config.toml, .env, channels, workspace)
      - ${JYC_DATA_DIR:-./}:/opt/jyc

      # Git/GitHub credentials
      - ${JYC_DATA_DIR}/.netrc:/root/.netrc
      - ${JYC_DATA_DIR}/gh_hosts.yml:/root/.config/gh/hosts.yml

      # SSH keys (read-only); configure SSH_DIR in .env
      - ${SSH_DIR:-~/.ssh}:/root/.ssh:ro
    restart: unless-stopped
