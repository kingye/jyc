[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.15"
edition = "2024"

[profile.dev]
debug = 1
opt-level = 1
split-debuginfo = "packed"
lto = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
# NOTE: panic stays "unwind" — jyc-inspect/src/server.rs uses
# AssertUnwindSafe(catch_unwind) for dashboard event-forwarding tasks.
