[package]
name = "jyc-bridge-feishu"
version.workspace = true
edition.workspace = true
description = "Feishu channel bridge for JYC — connects to jyc over WebSocket"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
