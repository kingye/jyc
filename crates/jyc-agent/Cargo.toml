[package]
name = "jyc-agent"
version.workspace = true
edition.workspace = true
description = "In-process AI agent for the JYC framework"

[dependencies]
jyc-types = { path = "../jyc-types" }
jyc-utils = { path = "../jyc-utils" }
jyc-core = { path = "../jyc-core" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# HTTP + streaming
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "form",
    # The hub uses native-tls so rustls (and its aws-lc-rs C dependency) stays
    # out of the jyc binary's link graph. reqwest 0.13's `default-tls` feature
    # *is* rustls, so the default features are dropped and the rest of them
    # (charset, http2, system-proxy) are re-listed explicitly.
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling + logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"

# Live config (shared single source of truth with MessageRouter / inspect server)
arc-swap = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
regex = "1"
base64 = "0.23"
cron = { version = "0.17", default-features = false, features = ["serde"] }
rmcp = { version = "3.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
http = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Server side of rmcp, used only by the in-process fixture server in
# mcp_client round-trip tests (the production client needs no server code).
rmcp = { version = "3.1", features = ["server", "transport-io"] }
