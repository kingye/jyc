name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  # Note: an empty-commit retrigger does NOT work here — with an empty diff
  # every changed path falls under paths-ignore and the run is skipped.
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: jiny/jyc

jobs:
  build-slim:
    name: Build and push slim image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=slim
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Identify artifact retention
        id: release-tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "retention_days=400" >> "$GITHUB_OUTPUT"
          else
            echo "retention_days=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: slim
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jyc-build
          cache-to: type=gha,mode=max,scope=jyc-build
        # Main builds only need the record while debugging the immediate run;
        # exact semver tag records are kept for the latest five releases by
        # the shared prune workflow.
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: ${{ steps.release-tag.outputs.retention_days }}

  prune-artifacts:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-slim
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
