<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JYC Dashboard</title>
<style>
  :root {
    --bg: #1a1b26; --panel: #24283b; --border: #3b4261;
    --fg: #c0caf5; --dim: #565f89; --accent: #7aa2f7;
    --ok: #9ece6a; --warn: #e0af68; --err: #f7768e; --queued: #7dcfff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  [hidden] { display: none !important; }

  /* ── header / status bar ── */
  header, footer {
    display: flex; align-items: center; gap: 1em; flex-wrap: wrap;
    padding: .5em 1em; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  footer { border-top: 1px solid var(--border); border-bottom: 0; color: var(--dim); font-size: 12px; }
  header h1 { font-size: 15px; color: var(--accent); }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: .35em .8em; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: bold; }

  /* ── auth ── */
  #auth-view { margin: auto; text-align: center; padding: 2em; max-width: 22em; }
  #auth-view input {
    width: 100%; margin: 1em 0; padding: .5em; font: inherit;
    background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
  }
  #auth-view .error { color: var(--err); min-height: 1.5em; }

  /* ── channels strip ── */
  #channels {
    display: flex; gap: 1.2em; flex-wrap: wrap;
    padding: .4em 1em; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  #channels .dot { color: var(--ok); }

  /* ── overview layout ── */
  #overview-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #overview-main { flex: 1; display: flex; min-height: 0; }
  #thread-list { flex: 1; overflow-y: auto; }
  #detail {
    width: 22em; border-left: 1px solid var(--border);
    padding: 1em; overflow-y: auto; background: var(--panel);
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .35em .6em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--dim); font-weight: normal; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  tr.thread { cursor: pointer; }
  tr.thread:hover, tr.thread.selected { background: var(--panel); }

  .status-Idle { color: var(--dim); }
  .status-Processing { color: var(--ok); }
  .status-Queued { color: var(--queued); }
  .status-WaitingForAnswer { color: var(--warn); }
  .status-Error { color: var(--err); }

  #detail h2 { font-size: 14px; color: var(--accent); margin-bottom: .8em; word-break: break-all; }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: .2em 1em; font-size: 13px; }
  #detail dt { color: var(--dim); }
  #detail dd { word-break: break-all; }
  #detail .empty { color: var(--dim); }

  /* ── chat ── */
  #chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chat-info { padding: .3em 1em; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); }
  #chat-messages { flex: 1; overflow-y: auto; padding: .8em 1em; display: flex; flex-direction: column; gap: .5em; }
  .msg { max-width: 70ch; }
  .msg .meta { font-size: 11px; color: var(--dim); margin-bottom: .1em; }
  .msg .sender-user { color: var(--accent); }
  .msg .sender-ai { color: var(--ok); }
  .msg .text { white-space: pre-wrap; word-break: break-word; }
  .msg-activity { font-size: 12px; color: var(--dim); }
  #chat-thinking {
    padding: .2em 1em; font-size: 12px; color: var(--warn); font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #chat-thinking:empty { display: none; }
  #chat-input-row { display: flex; gap: .5em; padding: .6em 1em; border-top: 1px solid var(--border); background: var(--panel); }
  #chat-input {
    flex: 1; padding: .5em; font: inherit;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
  }
  #chat-processing { color: var(--ok); }
  #chat-processing.off { color: var(--dim); }

  /* ── mobile: single pane, detail becomes overlay ── */
  @media (max-width: 767px) {
    #detail {
      position: fixed; inset: 0; width: auto; z-index: 10;
      border-left: 0; padding-top: 3em;
    }
    #detail[hidden] { display: none !important; }
    #detail-close { position: absolute; top: .6em; right: .6em; }
  }
  @media (min-width: 768px) {
    #detail-close { display: none; }
  }
</style>
</head>
<body>

<div id="auth-view" hidden>
  <h1>JYC Dashboard</h1>
  <p style="color:var(--dim); margin-top:.5em">Enter the inspect server auth token.</p>
  <input id="token-input" type="password" placeholder="auth token" autocomplete="off">
  <div class="error" id="auth-error"></div>
  <button class="primary" id="token-submit">Connect</button>
</div>

<div id="overview-view" hidden>
  <header>
    <h1>JYC Dashboard</h1>
    <span id="hdr-version" style="color:var(--dim)"></span>
    <span class="spacer"></span>
    <button id="refresh-btn" title="Refresh now">↻</button>
    <button id="forget-btn" title="Forget token">Forget token</button>
  </header>
  <div id="channels"></div>
  <div id="overview-main">
    <div id="thread-list"><table>
      <thead><tr>
        <th>Thread</th><th>Channel</th><th>Pattern</th><th>Status</th><th>Tokens</th>
      </tr></thead>
      <tbody id="thread-rows"></tbody>
    </table></div>
    <div id="detail" hidden>
      <button id="detail-close">✕</button>
      <div id="detail-body"><p class="empty">Select a thread.</p></div>
    </div>
  </div>
  <footer id="statusbar">connecting…</footer>
</div>

<div id="chat-view" hidden>
  <header>
    <button id="chat-back">← Back</button>
    <h1 id="chat-title"></h1>
    <span class="spacer"></span>
    <span id="chat-processing" class="off">● idle</span>
  </header>
  <div id="chat-info"></div>
  <div id="chat-messages"></div>
  <div id="chat-thinking"></div>
  <div id="chat-input-row">
    <input id="chat-input" placeholder="Send a message to this thread…" autocomplete="off">
    <button class="primary" id="chat-send">Send</button>
  </div>
</div>

<script>
'use strict';

// ── token gate ──
const TOKEN_KEY = 'jyc_token';
let token = localStorage.getItem(TOKEN_KEY) || '';
let selected = null;   // {channel, name} of the selected thread
let lastState = null;  // most recent /api/state/overview payload

const $ = id => document.getElementById(id);

async function api(path) {
  const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { showAuth('Invalid token.'); throw new Error('auth'); }
  if (!res.ok) throw new Error(res.status + ' ' + path);
  return res.json();
}

function showAuth(error) {
  chatThread = null; // stop any WS reconnect loop
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  $('overview-view').hidden = true;
  $('chat-view').hidden = true;
  $('auth-view').hidden = false;
  $('auth-error').textContent = error || '';
  $('token-input').focus();
}

async function submitToken() {
  token = $('token-input').value.trim();
  try {
    await api('/api/state/overview');
    localStorage.setItem(TOKEN_KEY, token);
    $('auth-view').hidden = true;
    $('overview-view').hidden = false;
    startPolling();
  } catch (e) { /* showAuth already called on 401; network errors below */
    if (e.message !== 'auth') $('auth-error').textContent = 'Cannot reach server: ' + e.message;
  }
}

$('token-submit').onclick = submitToken;
$('token-input').onkeydown = e => { if (e.key === 'Enter') submitToken(); };
$('forget-btn').onclick = () => { localStorage.removeItem(TOKEN_KEY); location.reload(); };
$('refresh-btn').onclick = () => poll();
$('detail-close').onclick = () => { selected = null; renderDetail(null); markSelected(); };

// ── overview polling ──
let pollTimer = null;

function startPolling() {
  poll();
  if (!pollTimer) pollTimer = setInterval(poll, 2000);
}

async function poll() {
  try {
    const s = await api('/api/state/overview');
    render(s);
  } catch (e) {
    if (e.message !== 'auth') $('statusbar').textContent = 'poll failed: ' + e.message;
  }
}

// ── rendering ──
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtK(n) {
  if (n == null) return '-';
  return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n);
}

function fmtTokens(t) {
  if (t.context_input_tokens == null) return '-';
  let s = fmtK(t.context_input_tokens);
  if (t.max_tokens) {
    s += '/' + fmtK(t.max_tokens);
    s += ' (' + Math.round(100 * t.context_input_tokens / t.max_tokens) + '%)';
  }
  return s;
}

function fmtUptime(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
  return h ? h + 'h' + String(m).padStart(2, '0') + 'm' : m + 'm';
}

function render(s) {
  lastState = s;
  $('hdr-version').textContent = 'v' + s.version;
  $('channels').innerHTML = s.channels.map(c =>
    `<span><span class="dot">●</span> ${esc(c.name)} <span style="color:var(--dim)">(${esc(c.channel_type)})</span></span>`
  ).join('');

  $('thread-rows').innerHTML = s.threads.map(t => `
    <tr class="thread" data-channel="${esc(t.channel)}" data-name="${esc(t.name)}">
      <td>${esc(t.name)}</td>
      <td>${esc(t.channel)}</td>
      <td>${esc(t.pattern || '-')}</td>
      <td class="status-${esc(t.status)}">${esc(t.status)}</td>
      <td>${fmtTokens(t)}</td>
    </tr>`).join('');

  for (const row of $('thread-rows').querySelectorAll('tr.thread')) {
    row.onclick = () => {
      selected = { channel: row.dataset.channel, name: row.dataset.name };
      renderDetail(s.threads.find(t => t.channel === selected.channel && t.name === selected.name));
      markSelected();
    };
  }
  markSelected();

  // keep the detail pane in sync with the polled data
  if (selected) {
    const t = s.threads.find(t => t.channel === selected.channel && t.name === selected.name);
    if (t) renderDetail(t);
  }

  const st = s.stats;
  $('statusbar').textContent =
    `${st.active_workers} active / ${st.total_threads} threads │ ${st.messages_received} recv │ up ${fmtUptime(s.uptime_secs)} │ v${s.version}`;
}

function markSelected() {
  for (const row of $('thread-rows').querySelectorAll('tr.thread')) {
    row.classList.toggle('selected',
      !!selected && row.dataset.channel === selected.channel && row.dataset.name === selected.name);
  }
}

function renderDetail(t) {
  const pane = $('detail'), body = $('detail-body');
  if (!t) { pane.hidden = true; body.innerHTML = '<p class="empty">Select a thread.</p>'; return; }
  pane.hidden = false;
  const rows = [
    ['Channel', t.channel], ['Pattern', t.pattern], ['Status', t.status],
    ['Model', t.model], ['Mode', t.mode],
    ['Tokens', fmtTokens(t)],
    ['Output', fmtK(t.output_tokens)],
    ['Total in', fmtK(t.total_input_tokens)],
    ['Cache hit', fmtK(t.total_cache_hit_tokens)],
    ['Last active', t.last_active_at],
    ['Skills', (t.skills || []).join(', ')],
    ['Branch', t.branch],
  ].filter(([, v]) => v != null && v !== '' && v !== '-');
  body.innerHTML = `<h2>${esc(t.name)}</h2><dl>` +
    rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') +
    '</dl><p style="margin-top:1em"><button class="primary" id="open-chat">Open chat →</button></p>';
  $('open-chat').onclick = () => openChat(t.channel, t.name);
}

// ── chat screen ──
let chatThread = null;   // {channel, name} while chat is open
let ws = null;
let lastId = 0;          // last chat_message id seen (dedup)

async function openChat(channel, name) {
  chatThread = { channel, name };
  lastId = 0;
  $('overview-view').hidden = true;
  $('chat-view').hidden = false;
  $('chat-title').textContent = name;
  $('chat-messages').innerHTML = '';
  $('chat-thinking').textContent = '';
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

  const t = lastState && lastState.threads.find(t => t.channel === channel && t.name === name);
  $('chat-info').textContent = t
    ? [t.channel, t.model, t.mode, fmtTokens(t)].filter(v => v && v !== '-').join(' │ ')
    : channel;
  setProcessing(t && t.status === 'Processing', false);

  try {
    const history = await api(
      `/api/threads/${encodeURIComponent(channel)}/${encodeURIComponent(name)}/chat?limit=100`);
    for (const m of history) appendMessage(m);
  } catch (e) {
    if (e.message !== 'auth') appendActivity('failed to load history: ' + e.message);
  }
  connectWs();
  $('chat-input').focus();
}

function closeChat() {
  chatThread = null;
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  $('chat-view').hidden = true;
  $('overview-view').hidden = false;
  selected = null;
  renderDetail(null);
  startPolling();
}

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const { channel, name } = chatThread;
  return `${proto}://${location.host}/ws/${encodeURIComponent(channel)}/${encodeURIComponent(name)}?token=${encodeURIComponent(token)}`;
}

function connectWs() {
  ws = new WebSocket(wsUrl());
  ws.onmessage = e => {
    try { handleWsEvent(JSON.parse(e.data)); } catch { /* drop malformed frame */ }
  };
  ws.onclose = () => {
    // Unexpected drop while chat is open → reconnect after a pause.
    if (chatThread) {
      $('chat-thinking').textContent = 'reconnecting…';
      setTimeout(() => { if (chatThread) connectWs(); }, 2000);
    }
  };
  ws.onerror = () => ws.close();
}

function handleWsEvent(ev) {
  switch (ev.type) {
    case 'chat_message':
      if (ev.id && ev.id <= lastId) return;   // duplicate after reconnect
      if (ev.id) lastId = ev.id;
      appendMessage(ev.entry);
      break;
    case 'activity':
      if (!ev.entry.is_internal) appendActivity(ev.entry.text);
      break;
    case 'thinking':
      $('chat-thinking').textContent = ev.text || '';
      break;
    case 'processing':
      setProcessing(ev.is_processing, ev.has_error);
      break;
    case 'resync':
      // Lagged: drop the live buffer and re-hydrate from REST.
      if (chatThread) {
        $('chat-messages').innerHTML = '';
        lastId = 0;
        api(`/api/threads/${encodeURIComponent(chatThread.channel)}/${encodeURIComponent(chatThread.name)}/chat?limit=100`)
          .then(h => h.forEach(appendMessage))
          .catch(() => {});
      }
      break;
  }
}

function setProcessing(isProcessing, hasError) {
  const el = $('chat-processing');
  el.className = isProcessing ? '' : 'off';
  el.textContent = hasError ? '● error' : isProcessing ? '● processing' : '● idle';
}

function fmtTime(ts) {
  return ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}

function appendMessage(m) {
  if (m.id) lastId = Math.max(lastId, m.id);
  const box = $('chat-messages');
  const senderClass = m.sender === 'user' ? 'sender-user' : 'sender-ai';
  box.insertAdjacentHTML('beforeend',
    `<div class="msg"><div class="meta"><span class="${senderClass}">${esc(m.sender)}</span> ${fmtTime(m.timestamp)}</div>` +
    `<div class="text">${esc(m.text)}</div></div>`);
  box.scrollTop = box.scrollHeight;
}

function appendActivity(text) {
  const box = $('chat-messages');
  box.insertAdjacentHTML('beforeend', `<div class="msg-activity">· ${esc(text)}</div>`);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
}

$('chat-back').onclick = closeChat;
$('chat-send').onclick = sendChat;
$('chat-input').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

// ── boot ──
if (token) {
  $('overview-view').hidden = false;
  startPolling();
} else {
  showAuth();
}
</script>
</body>
</html>
