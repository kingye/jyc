name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual retrigger for when GitHub drops a push event (observed 2026-08-20).
  workflow_dispatch:

# Serialize runs per ref type: rapid pushes to main must not race the nightly
# delete/recreate, and a version-tag release should not block on (or be
# blocked by) a nightly build.
concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_tag: ${{ steps.release.outputs.target_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      publish_release: ${{ steps.release.outputs.publish_release }}
    permissions:
      contents: write
    steps:
      # Create (or refresh) the release target before the matrix starts. Build
      # jobs upload their archives directly as release assets, so Release no
      # longer depends on Actions artifact storage.
      - name: Prepare release target
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "target_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

            # Inspect every matching release: a draft can coexist with a
            # published sibling after a failed retry, and deleting by tag would
            # otherwise remove the published release as well.
            MATCHING_RELEASES="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$REF_NAME\") | [.id, .draft] | @tsv")"
            PUBLISHED_COUNT=0
            DRAFT_IDS=()
            while IFS=$'\t' read -r release_id is_draft; do
              [[ -z "$release_id" ]] && continue
              if [[ "$is_draft" == "true" ]]; then
                DRAFT_IDS+=("$release_id")
              else
                PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
              fi
            done <<< "$MATCHING_RELEASES"

            if (( PUBLISHED_COUNT > 0 )); then
              echo "Release $REF_NAME is already published; nothing to do"
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
            elif (( ${#DRAFT_IDS[@]} > 0 )); then
              # Remove only stale draft records before the matrix uploads
              # assets; a published sibling was handled above and is preserved.
              for release_id in "${DRAFT_IDS[@]}"; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              done

              # Recreate the tag at this run's commit before --verify-tag.
              if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$REF_NAME"; then
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME" >/dev/null 2>&1; then
                  echo "Failed to remove stale $REF_NAME tag" >&2
                  exit 1
                fi
              fi
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$REF_NAME" \
                -f "sha=$SOURCE_SHA"

              gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --generate-notes
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
            else
              gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --generate-notes
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Stage the new nightly privately. The published nightly stays
            # available until every asset has uploaded and the release job
            # swaps the tag below.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '.[] | select(.tag_name=="nightly-staging") | .id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-staging" || true

            gh release create nightly-staging --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --draft --prerelease \
              --title "Nightly Build ($SOURCE_SHA)" \
              --notes "Automated nightly build from commit $SOURCE_SHA"
            {
              echo "release_tag=nightly-staging"
              echo "target_tag=nightly"
              echo "source_sha=$SOURCE_SHA"
              echo "publish_release=true"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Include runner OS in cache key so different Ubuntu versions
          # (e.g., ubuntu-latest in CI vs ubuntu-22.04 here) don't poison
          # each other's GLIBC-linked build artifacts.
          prefix-key: "v0-rust-${{ matrix.os }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binaries
        # jyc: agent core + TUI; jyc-pipe: peripheral channel pipe process
        # (pipe process split — docs/architecture/pipe-split.md).
        #
        # Two invocations on purpose: feature resolution is per-invocation, and
        # building both packages at once unifies their reqwest features, which
        # links the pipe's rustls backend into the hub binary. The hub uses
        # native-tls, the pipe keeps reqwest's rustls default.
        run: |
          cargo build --release -p jyc-cli --target ${{ matrix.target }}
          cargo build --release -p jyc-channels --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/jyc-${{ matrix.target }}.tar.gz jyc jyc-pipe

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/jyc-${{ matrix.target }}.tar.gz"

  release:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The plugin archive: the user-editable collections this repo ships, in
      # the layout `jyc plugins install` expects at an archive (or directory)
      # root. Built here rather than in `build`, so the matrix does not produce
      # it once per target. sync-gitee-release.yml mirrors it as well.
      - name: Package plugin archive
        run: |
          mkdir -p dist
          tar -czf dist/jyc-plugins.tar.gz skills subagents hooks templates

      - name: Upload plugin archive to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/jyc-plugins.tar.gz

      # Move the fully uploaded staging draft onto the public nightly tag only
      # after every matrix and plugin upload has succeeded. Keep the previous
      # nightly release on a per-attempt backup tag until the new release is
      # verified public; restore that release if the swap cannot complete.
      - name: Replace nightly release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          TARGET_TAG="nightly"
          BACKUP_TAG="nightly-previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          release_record() {
            local tag_name=$1
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"$tag_name\")][0] | if . == null then empty else [.id, .target_commitish, .draft] | @tsv end"
          }

          STAGING_RECORD="$(release_record "$RELEASE_TAG")"
          if [[ -z "$STAGING_RECORD" ]]; then
            echo "Missing staging release $RELEASE_TAG" >&2
            exit 1
          fi
          IFS=$'\t' read -r STAGING_RELEASE_ID STAGING_TARGET STAGING_DRAFT <<< "$STAGING_RECORD"
          if [[ -z "$STAGING_RELEASE_ID" || "$STAGING_DRAFT" != "true" ]]; then
            echo "Staging release $RELEASE_TAG is missing or not a draft" >&2
            exit 1
          fi

          OLD_RECORD="$(release_record "$TARGET_TAG")"
          OLD_RELEASE_ID=""
          OLD_TARGET=""
          OLD_DRAFT=""
          if [[ -n "$OLD_RECORD" ]]; then
            IFS=$'\t' read -r OLD_RELEASE_ID OLD_TARGET OLD_DRAFT <<< "$OLD_RECORD"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
              -f "tag_name=$BACKUP_TAG" \
              -F "draft=false" \
              -F "prerelease=true"
          fi

          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID" \
            -f "tag_name=$TARGET_TAG" \
            -f "target_commitish=$SOURCE_SHA" \
            -F "draft=false" \
            -F "prerelease=true"; then
            if [[ -n "$OLD_RELEASE_ID" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID" \
                -f "tag_name=$TARGET_TAG" \
                -f "target_commitish=$OLD_TARGET" \
                -F "draft=$OLD_DRAFT" \
                -F "prerelease=true"
              RESTORED_RECORD="$(release_record "$TARGET_TAG")"
              IFS=$'\t' read -r RESTORED_ID RESTORED_TARGET RESTORED_DRAFT <<< "$RESTORED_RECORD"
              if [[ "$RESTORED_ID" != "$OLD_RELEASE_ID" || "$RESTORED_DRAFT" != "$OLD_DRAFT" ]]; then
                echo "Failed to restore the previous nightly release; recover release $OLD_RELEASE_ID from tag $BACKUP_TAG" >&2
                exit 1
              fi
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$BACKUP_TAG"
            fi
            echo "Failed to publish staging release $RELEASE_TAG" >&2
            exit 1
          fi

          # The swap has committed. Remove the previous release only after the
          # new public nightly exists; staging-tag cleanup below is optional.
          if [[ -n "$OLD_RELEASE_ID" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$BACKUP_TAG"
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true

      # Publishing (rather than merely uploading assets) is what triggers the
      # release:published event consumed by sync-gitee-release.yml. The nightly
      # swap above publishes its staged release directly.
      - name: Publish prepared release
        if: needs.prepare-release.outputs.publish_release == 'true' && needs.prepare-release.outputs.target_tag != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  prune-artifacts:
    # Keep Actions artifacts for the latest five release tags. Release binaries
    # are GitHub Release assets, so this now applies to Docker build records;
    # GitHub Release assets are separate.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/prune-artifacts.yml
