# --- Feishu Adapter Example (pipe-only) ---
# Feishu is a pipe-only channel (see docs/architecture/overview.md): it owns no
# topics, agents, or state — every enabled pattern must pipe into a websocket
# agent channel. Uncomment and configure for Feishu/Lark integration.
[channels.feishu_bot]
type = "feishu"
#
[channels.feishu_bot.feishu]
app_id = "cli_xxxxxxxxx"
app_secret = "xxxxxxxxxxxx"
base_url = "https://open.feishu.cn" # or "https://open.larksuite.com" for international

[channels.feishu_bot.feishu.websocket]
enabled = true
reconnect_delay_secs = 5
max_reconnect_attempts = 10
heartbeat_interval_secs = 30

[[channels.feishu_bot.patterns]]
name = "feishu_bot"
enabled = true
# Required: pipe messages matching this pattern into an agent. The message is
# re-targeted and routed through the agents channel's own router (identical to
# a chat-pane message), so the agent's configuration — topic_path, template,
# skills, model — applies. A matched pattern without `pipe` drops the message
# with a warning.
#
# Forms:
#   pipe = { agent = "jin" }
#     The agent named `jin`; without `topic`, the pattern's own topic name
#     (or the subject-derived one) is used.
#   pipe = { agent = "jin", topic = "${msg.chat_name}" }
#     The topic name is derived per chat via the runtime placeholder
#     `${msg.chat_name}` (resolved from the message's chat name, sanitized for
#     filesystem use) — e.g. one `mentions` pattern serving many group chats.
#     Distinct from load-time `${ENV_VAR}` expansion: the `msg.` namespace is
#     resolved per message at runtime. Messages without a chat name (e.g. P2P
#     chats) are dropped with a warning when the placeholder is used.
pipe = { agent = "jin", topic = "${msg.chat_name}" }

# Feishu-specific pattern matching
[channels.feishu_bot.patterns.rules]
mentions = ["jyc"]

# --- AI (the shared brain) ---

[ai]
enabled = true
mode = "agent"
# mode = "static"
# text = "Thank you for your message."

# Model identifier (e.g., "SiliconFlow/Pro/zai-org/GLM-4.7").
# This is the lowest-priority fallback in the resolution chain:
#   .jyc/model-override > pattern-level model > channel-level model > global [ai].model
# model = "ark/deepseek-v3.2"

# Optional: a smaller / faster model used for ancillary LLM work, currently:
#   - cycle-boundary progress summary (every `max_iterations` rounds)
#   - between-message context-reset summary (when input tokens cross 95% of
#     the model's context window)
# Falls back to `model` if unset, or if provider construction fails (logged
# as a warning, the agent continues).
# Resolution chain: pattern-level small_model > channel-level small_model > global [ai].small_model
# small_model = "deepseek/deepseek-v4-flash"
#
# Either id can be referenced from wherever the model chain resolves — an
# `[agents.<name>].model` or a subagent type's `[ai].model` — so a role can say
# "run on the small model" without freezing today's id:
#   model = "${ai.model}"        # whatever [ai].model is
#   model = "${ai.plan_model}"   # whatever [ai].plan_model is
#   model = "${ai.build_model}"  # whatever [ai].build_model is
#   model = "${ai.small_model}"  # whatever [ai].small_model is
#   model = "${ai.models.review}"  # a named slot, see [ai.models] below
# A reference that cannot be resolved (the value is unset, the name does not
# resolve, or the value it points at is itself a reference) is reported at
# error level and treated as no override — never passed on to a provider as its
# own literal text.
#
# Write it where a role or an agent picks a model (`[agents.<name>].model`, a
# subagent type's `[ai].model`); written in `[ai]` itself, the value it points at
# has to be set, because there is nothing behind `[ai].model` to fall back to.

# User-defined named model slots: any number of extra named models, referenced
# as "${ai.models.<name>}". Names may contain letters, digits, `_` and `-`.
# [ai.models]
# review = "deepseek/deepseek-v4-flash"
# audit = "anthropic/claude-opus-4-6"

system_prompt = "You are an AI assistant. Respond professionally and concisely."

# Maximum iterations per cycle (default: 500)
# max_iterations = 500

# SSE read timeout in seconds (default: 120).
# Maximum gap between SSE stream events before the stream is considered hung
# and triggers a retry. Increase if your provider (e.g. DeepSeek reasoning mode)
# sends large reasoning blocks with extended gaps between tokens.
# sse_read_timeout_secs = 120

# --- AI providers ---
#
# Define one entry per provider. The `model` and `small_model` keys above
# select which provider/model pair is active using `<provider>/<model-id>`.
#
# `supports_images` (per-provider or per-model, model-level wins) declares
# whether the model accepts native image content blocks. When true, the
# `read_image` built-in tool is registered, and per-pattern
# `inject_inbound_images` (see channel patterns) can take effect.
#
# [ai.providers.deepseek]
# type = "openai-compatible"
# base_url = "https://api.deepseek.com"
# api_key = "${DEEPSEEK_API_KEY}"
# context_window = 128000
# # Optional: replace the default User-Agent header for this provider's requests.
# # Useful for endpoints (e.g. Kimi coding) that gate access by client identity.
# # user_agent = "opencode/1.15.13"
#
# [ai.providers.deepseek.models."deepseek-v4-pro"]
# supports_images = true
# # Model-level user_agent overrides the provider-level value.
# # user_agent = "opencode/1.15.13"
# # Optional: actual model identifier sent to the remote LLM. When unset,
# # the map key ("deepseek-v4-pro") is sent. This lets multiple aliases with
# # different params share one remote model, e.g.:
# #   [ai.providers.kimi.models."k3-high"]
# #   model_id = "k3"
# #   params = { reasoning_effort = "high" }
# #   [ai.providers.kimi.models."k3-low"]
# #   model_id = "k3"
# #   params = { reasoning_effort = "low" }
# # model_id = "ep-xxxxxxxx"
#
# --- OpenAI Responses API provider (GPT-5.x / o-series reasoning models) ---
#
# `type = "openai-responses"` targets the Responses API (`POST
# {base_url}/responses`) instead of Chat Completions. Recommended for OpenAI
# reasoning models:
# - Chat Completions never streams reasoning content (only bills it), and
#   for gpt-5.6+ rejects requests combining tools with a non-"none"
#   reasoning_effort. The Responses API supports tools + reasoning together.
# - With `reasoning.summary` set, a reasoning SUMMARY is streamed and shown
#   by `/thinking show` (raw chain-of-thought is never exposed by OpenAI).
#
# [ai.providers.openai]
# type = "openai-responses"
# base_url = "https://api.openai.com/v1"
# api_key = "${OPENAI_API_KEY}"
#
# # Per-model reasoning effort via the model_id alias pattern:
# [ai.providers.openai.models."gpt-5.6-low"]
# model_id = "gpt-5.6"
# params = { reasoning = { effort = "low", summary = "auto" } }
# # [ai.providers.openai.models."gpt-5.6-high"]
# # model_id = "gpt-5.6"
# # params = { reasoning = { effort = "high", summary = "auto" } }
#
# [ai.providers.anthropic]
# type = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key = "${ANTHROPIC_API_KEY}"
# # Prompt-cache TTL: "5m" (default) or "1h". With "1h", every cache
# # breakpoint is written with a 1-hour lifetime (extended-cache-ttl beta)
# # instead of 5 minutes — worthwhile for bursty traffic where turns are
# # minutes-to-an-hour apart. Cache writes then bill at 2× the input rate
# # instead of 1.25×, so pair it with cache_creation_per_million at the
# # 1h write rate. Model-level `cache_ttl` overrides the provider value.
# # cache_ttl = "1h"
# # Provider-level billing rates, applied to every model under this
# # provider unless the model sets its own. See "Cost tracking" below.
# # Anthropic splits cache tokens into read (`cache_read_input_tokens`)
# # and write (`cache_creation_input_tokens`) buckets that bill at
# # different rates. Set `cache_creation_per_million` to bill writes at
# # their premium rate (~1.25× input for Opus / Sonnet 4.x); omit it
# # to fall back to `cache_hit_per_million` for both buckets.
# pricing = { input_per_million = 3.0, output_per_million = 15.0, cache_hit_per_million = 0.3, cache_creation_per_million = 3.75, currency = "USD" }
#
# [ai.providers.anthropic.models."claude-opus-4-7"]
# supports_images = true
# # Model-level rates override the provider default above.
# pricing = { input_per_million = 15.0, output_per_million = 75.0, cache_hit_per_million = 1.5, cache_creation_per_million = 18.75, currency = "USD" }

# --- Cost tracking ---
#
# When a model (or its provider) has `pricing` set, jyc computes the cost
# of every LLM call and shows it in the dashboard and chat Topic Info
# panes as "Cost: ¥Y today · ¥X session" ($ for USD-priced models).
# With no `pricing` configured,
# no cost is computed and the row is hidden.
#
# Rates are per 1,000,000 tokens, in whatever currency `currency` names
# (default "CNY"). jyc never converts between currencies, so a provider
# billing in USD must set `currency = "USD"` explicitly. Cost per call:
#
#   (input - cache_read - cache_creation) * input_per_million         / 1e6
# + output_tokens                         * output_per_million        / 1e6
# + cache_read_tokens                     * cache_hit_per_million     / 1e6
# + cache_creation_tokens                 * cache_creation_per_million / 1e6
#                                         (defaults to cache_hit_per_million)
#
# `cache_hit_per_million` defaults to 0.0; set it equal to
# `input_per_million` for providers that bill cache hits at the full
# input rate. `cache_creation_per_million` is optional (defaults to
# `cache_hit_per_million`) — Anthropic is the only provider that
# distinguishes cache writes from reads.
#
# Subscription plans (flat-fee coding plans): set `billing = "subscription"`
# and `monthly_fee` on the provider — one plan covers every model under it.
# Token rates then express the notional, API-equivalent value — ledger cost
# is not real spend. `/bill` reports such providers in a separate
# "Subscription" section with a per-provider utilization line (the combined
# notional value of all the provider's models vs the fee, prorated to the
# report scope at 1/30 per day), e.g. whether a ¥49/month plan paid for
# itself. The fee's currency is the provider-level `pricing.currency`
# (default CNY):
#
# [ai.providers.kimi]
# type = "anthropic"
# base_url = "https://api.kimi.com/coding/v1"
# api_key = "${KIMI_API_KEY}"
# billing = "subscription"
# monthly_fee = 25.0
# pricing = { input_per_million = 2.0, output_per_million = 8.0, currency = "CNY" }
#
# [ai.providers.kimi.models.kimi-for-coding]
# # Models may keep their own `pricing` when plan tiers bill differently;
# # the fee/utilization line still aggregates per provider.
# pricing = { input_per_million = 6.5, output_per_million = 27.0, currency = "CNY" }
#
# A CNY-priced metered provider, for example:
#
# [ai.providers.my_cn_provider]
# type = "openai-compatible"
# base_url = "https://api.example.cn"
# api_key = "${CN_API_KEY}"
# # `currency = "CNY"` is the default and may be omitted; shown here for clarity.
# pricing = { input_per_million = 3.0, output_per_million = 4.0, cache_hit_per_million = 0.5, currency = "CNY" }
#
# # Time-of-day pricing: providers like DeepSeek discount off-peak hours.
# # Add `time_windows` to a `pricing` block — each window overrides the
# # flat rates above during its hours (rates omitted on a window inherit
# # the flat values). Times are `HH:MM` (or `HH:MM:SS`)
# # in the fixed UTC offset named by `utc_offset` (default UTC; DeepSeek's
# # discount schedule is Beijing time → "+08:00"). A window whose
# # `start > end` wraps past midnight; `start == end` spans the whole day.
# # A window may restrict itself to weekdays via `days` (`"mon"`..`"sun"`,
# # case-insensitive; omitted/empty = every day). First matching window
# # wins; outside every window the flat rates above apply. Example:
# # standard ¥2/M in, ¥8/M out; 50% off 00:30–08:30, 25% off 16:30–00:30,
# # and weekend-only all-day pricing at ¥1/M in:
# #
# # [ai.providers.deepseek]
# # type = "openai-compatible"
# # base_url = "https://api.deepseek.com"
# # api_key = "${DEEPSEEK_API_KEY}"
# # pricing = { input_per_million = 2.0, output_per_million = 8.0, currency = "CNY", utc_offset = "+08:00", time_windows = [
# #   { start = "00:30", end = "08:30", input_per_million = 1.0, output_per_million = 4.0 },
# #   { start = "16:30", end = "00:30", input_per_million = 1.5, output_per_million = 6.0 },
# #   { start = "00:00", end = "00:00", days = ["sat", "sun"], input_per_million = 1.0, output_per_million = 4.0 },
# # ] }
# #
# # Long-context pricing: providers like GPT-5.6 re-bill the WHOLE request
# # at elevated rates once its input (cache buckets included) exceeds a
# # threshold. Add `long_context` to the pricing block; cache rates omitted
# # on the tier inherit/collapse like window fields:
# #
# # pricing = { input_per_million = 3.42, output_per_million = 20.15, cache_hit_per_million = 0.34, cache_creation_per_million = 4.27, currency = "CNY", long_context = {
# #   threshold = 272_000,
# #   input_per_million = 6.77, output_per_million = 30.19,
# #   cache_hit_per_million = 0.68, cache_creation_per_million = 8.46,
# # } }
# #
# # Opt-in prompt caching (GPT-5.6): inject `prompt_cache_key` /
# # `prompt_cache_options` into every request via `params`. Placeholders
# # `{channel}` / `{topic}` expand per session so each topic gets its own
# # cache-affinity bucket (cache hits are always matched by prompt-prefix
# # content; the key only stops workloads evicting each other):
# #
# # params = { prompt_cache_key = "jyc-{channel}-{topic}", prompt_cache_options = { mode = "implicit", ttl = "30m" } }
# #
# Two figures are tracked per topic:
#   - session: resets when the agent session is reset (`/reset`)
#   - today:   durable UTC-day total, appended per call to
#     <topic>/.jyc/bill-YYYY-MM-DD.jsonl and never reset or truncated

# --- AI Vision Fallback ---
#
# When the primary model does not support images (supports_images = false),
# the `read_image` tool can fall back to a separate vision model (e.g.,
# DeepSeek-OCR) to analyze images and return text descriptions.
#
# The `provider` field references a named entry in `[ai.providers]` above
# to reuse its `base_url` and `api_key`,
# avoiding duplicate credentials.
#
# [ai.vision]
# enabled = true
# provider = "deepseek"
# model = "deepseek-ocr"
# # Optional: custom prompt sent to the vision model alongside each image
# # prompt = "请仔细识别并提取图片中的所有文字内容"

# --- Session reset ---
#
# `/reset` clears the agent session: the context and the session file go
# away, the chat history stays. There is no compression mode any more —
# the sliding-window context strategy keeps the context inside the
# model's window, so there is nothing to summarize before starting over.
#
# `reset_compression` and `auto_reset_threshold` are deprecated and ignored
# (they configure the removed auto-reset mechanism). The keys are still
# accepted so configs written before the removal keep loading.
# reset_compression = { mode = "llm", keep_pairs = 3 }
# auto_reset_threshold = 0.95

# Default context management strategy. Per-pattern `context_strategy`
# takes priority. Overridden at runtime by the `.jyc/context-strategy.json`
# file written by `/context`.
# mode: "full" | "sliding_window" (alias "sliding"). Default: "sliding_window".
#
# sliding_window sends an *anchored* window of the journal: it only ever
# grows between slides, until it reaches max_window turns, then slides back
# to `window` turns. Slides are the only way history shrinks.
#
# History is text-only, so the payload is append-only: every turn appends to
# the end and the provider's prefix cache keeps matching (another turn's tool
# calls and results stay in the journal; `context_browse` still reaches them).
# Only the current turn is sent verbatim, with its tool calls and results.
#
# window: the number of turns the window keeps after a slide — its floor.
# Default: 10. 0 is treated as 1 (a window holds at least one turn);
# `/context sliding 0` is rejected instead of silently floored.
# extend_rate: the window may grow past `window` up to
# max_window = window + round(extend_rate * window) before it slides back.
# Default: 0.5 (window 10 -> grows to 15, then slides to 10). 0 makes
# `window` a hard cap that slides on every turn — every turn then re-encodes
# the history and the prompt cache stops paying off.
# turn_tool_result_cap: cap each tool result in the current turn, keeping
# the head and tail of an oversized result. Unset by default (the current
# turn is in flight, so trimming it is opt-in). 0 means off. A non-zero
# value below 130 is lifted to 130: below that the drop marker leaves no
# room for both ends, so the trim would degrade to a head-only cut and
# gut the result. `/context` refuses such a value instead of lifting it.
# max_history_tokens: optional second trigger for a slide. When the window
# has reached `max_window` turns and its estimated weight exceeds this, it
# slides back to `window` turns — the same slide a window over `max_window`
# turns performs. It is deliberately not a per-turn trigger: a window whose
# `window` turns alone exceed the budget cannot get under it, and sliding
# every turn to chase it would re-encode the payload every turn. It never
# trims anything by itself, and the current turn is not part of it. window
# counts turns, so a window of 10 weighs 2k tokens or 200k; this bounds that
# weight by triggering the slide. The estimate is heuristic (CJK characters
# ~1 token, other bytes ~1/4), not a tokenizer. Unset by default.
# context_strategy = { mode = "sliding_window", window = 10, extend_rate = 0.5 }
# context_strategy = { mode = "sliding_window", window = 10, extend_rate = 0.5, max_history_tokens = 30000 }


[ai.attachments]
enabled = true
max_file_size = "10mb"
allowed_extensions = [".ppt", ".pptx", ".doc", ".docx", ".txt", ".md", ".pdf"]

# --- Unified Attachment Configuration ---
# This is the new unified configuration for both inbound and outbound attachments.
# It can be used alongside the per-pattern attachments configuration.
[attachments]

# Inbound attachment configuration (downloading attachments from messages)
[attachments.inbound]
enabled = true
allowed_extensions = [
  ".pdf",
  ".pptx",
  ".docx",
  ".xlsx",
  ".png",
  ".jpg",
  ".txt",
  ".md",
]
max_file_size = "25mb"
max_per_message = 10
# save_path = "./downloads"  # Optional: custom path for downloaded attachments
# Unset, they are saved into the topic's working directory, under
# `.attachments/`. An absolute save_path is used as given; a relative one
# resolves under the working directory.

# Outbound attachment configuration (sending attachments with replies)
[attachments.outbound]
enabled = true
allowed_extensions = [
  ".pdf",
  ".pptx",
  ".docx",
  ".xlsx",
  ".png",
  ".jpg",
  ".txt",
  ".md",
]
max_file_size = "10mb"
max_per_message = 5

# --- Inspect Server ---
# Exposes runtime state via TCP for the TUI dashboard.
# Run `jyc dashboard` to connect.
#
# When enabled, `jyc serve` generates a random authorization token and
# writes it to <data dir>/auth.token. The dashboard auto-loads it; use
# `jyc token show` to retrieve it manually.

[inspect]
enabled = true
bind = "127.0.0.1:9876"  # Default; localhost only for security

# Externally-reachable base URL of the inspect server, used for any link that
# leaves the server — currently the share links returned by the jyc_publish_file
# tool and the /exchange command (/exchange/<channel>/<topic>/<name>?token=).
# Must include the scheme; a port and a subpath are allowed:
#   "https://jyc.example.com"  "http://192.168.1.50:9876"  "https://example.com/jyc"
#
# REQUIRED when a reverse proxy exposes the inspect server, or when `bind` is a
# wildcard address (0.0.0.0 / [::]) — a wildcard is not reachable from a client.
# When unset, falls back to http://<bind>, substituting this host's primary LAN
# IP for a wildcard host (a guess that cannot account for a proxy).
# base_url = "https://jyc.example.com"

# --- External Pipe Process ---
# `jyc-pipe`, a separate peripheral message-pipe process, claims every
# configured channel whose type it can run (currently feishu) and talks to
# the hub over websocket; `jyc serve` skips spawning those channels
# in-process. No config section is involved — ownership is derived from
# the pipe's adapter capabilities, so both processes agree by reading the
# same channel list. See docs/architecture/pipe-split.md.

# --- Custom Commands ---
# User-defined slash commands. Each `[[commands]]` entry adds a `/<name>`
# command that appears in `/?` and the dashboard command popup (press `/`).
#
# Invoking the command:
#   1. switches the topic to `mode` (when set; `plan` or `build`),
#   2. tells the agent which `skills` to use (the system prompt lists the
#      skills the topic's allow-list enables, so a name outside that list
#      is named here for the agent to read from its SKILL.md),
#   3. appends `user_prompt` to the message body.
#
# Anything you type after the command is kept, with `user_prompt` appended
# last so it is the most recent instruction. These are equivalent:
#     /review focus on error handling
# and
#     /review
#     focus on error handling
#
# `name` must be lowercase (command lookup is case-insensitive) and must not
# shadow a built-in command. The built-ins are exactly the commands `/?` lists
# — they are declared once in `crates/jyc-core/src/command/builtin.rs`, so this
# comment deliberately does not repeat them. Invalid names fail validation at
# startup rather than being silently ignored.
#
# [[commands]]
# name = "review"
# description = "Review the current branch for over-engineering"
# mode = "plan"                                  # optional: plan | build
# skills = ["pr-review", "ponytail-review"]      # optional
# user_prompt = """
# Review the changes on the current branch against main.
# Report findings grouped by severity. Do not modify any code.
# """
#
# [[commands]]
# name = "ship"
# description = "Run checks and prepare a release"
# mode = "build"
# skills = ["dev-workflow"]
# user_prompt = "Run the pre-PR checklist, then summarize what is left to do."
#
# --- Shell variant ---
# A `[[commands]]` entry can also be a direct shell invocation instead of an
# LLM prompt — set `shell` to an argv array. The handler runs it via
# `tokio::process::Command` and replies with stdout/stderr; the LLM is NOT
# invoked, so no tokens are spent. User args typed after the command are
# appended to `shell` as more argv elements:
#
#   /deploy staging prod  →  runs scripts/deploy.sh staging prod
#
# Security note: `shell` is argv-only (no shell quoting, no interpolation),
# but ANY inbound channel (email, feishu, websocket) can trigger any
# registered command. Treat `[[commands]]` as an operator-trust surface —
# only add shell commands that you would accept any inbound sender invoking.
# Output cap 8 KiB is fixed; the 30s kill timeout is overridable per command
# with `timeout = <secs>` (full details: README "Shell Commands").
#
# `shell` and `user_prompt` are mutually exclusive — one per command. `mode`
# and `skills` are silently ignored on shell commands (they are an LLM
# concept and this path never reaches the LLM).
#
# [[commands]]
# name = "ls"
# description = "List the topic directory"
# shell = ["ls"]              # /ls -la  →  runs ["ls", "-la"]
#
# [[commands]]
# name = "deploy"
# description = "Deploy to staging"
# shell = ["./scripts/deploy.sh"]  # user args appended: /deploy staging prod
# timeout = 300                    # optional: seconds before kill (default 30)

# --- Hooks ---
# External commands invoked at agent lifecycle points (Claude Code-style).
# Two levels, merged per topic like [[commands]]: global `[[hooks]]` first,
# then `[[agents.<name>.hooks]]` for the routed agent. The event payload
# JSON is written to the hook's stdin; the working directory is the topic
# dir. Exit code 0 = proceed; 2 = block the action (stderr is surfaced to
# the model for tool events); any other code or a timeout fails open.
# Full event table, payload schemas, and Claude Code compatibility:
# docs/hooks.md.
#
# Events (jyc names — or Claude Code names UserPromptSubmit/PreToolUse/
# PostToolUse/Stop/SessionStart/SessionEnd as aliases; the spelling also
# selects the stdin payload dialect so CC scripts work unmodified):
#   message_received    blocking — gates AI dispatch of an inbound message
#   pre_tool_use        blocking — matcher = tool name regex
#   post_tool_use       blocking (result marked error, stderr appended)
#   post_tool_use_failure  notification (jyc-only, no CC name)
#   reply_send          blocking — suppresses an AI reply delivery
#   session_start       notification; source: startup | reset | new
#   session_end         notification; reason: reset | new | close (pre-teardown)
#
# [[hooks]]
# event = "reply_send"
# shell = ["sh", "-c", "tee -a /var/log/jyc-replies.log >/dev/null"]
#
# [[agents.jyc.hooks]]
# event = "pre_tool_use"           # or "PreToolUse" for CC payload
# matcher = "^bash$"               # optional regex (tool events: tool name)
# shell = ["./scripts/guard.sh"]   # argv form; stdin = payload JSON
# timeout = 30                     # optional: seconds before kill (default 30)
#
# Topic builtins resolve per topic at spawn (also exported as env vars):
# [[hooks]]
# event = "session_start"
# shell = ["sh", "-c", 'printf "%s started\n" "${JYC_TOPIC_PATH}" >> "${JYC_CONFIG_PATH}/sessions.log"']

# --- MCP Servers ---
# Named MCP server definitions are configured here and loaded by the agent at startup.
# Each MCP can be `local` (subprocess via stdio) or `remote` (HTTP).
# Tools from each MCP server are dynamically discovered and registered in the agent.

# [[mcps]]
# name = "invoice"
# type = "local"
# command = ["invoice", "mcp"]

# [[mcps]]
# name = "remote_mcp"
# type = "remote"
# url = "https://mcp.example.com/handler"
# enabled = true
# # auth_header = "sk-..."    # Bearer token (sent as Authorization: Bearer <token>)
# # [mcps.custom_headers]
# # "X-API-Key" = "your-api-key"
# # "X-Organization" = "my-org"
# # --- OAuth2 client_credentials (machine-to-machine) ---
# # See CHANGELOG.md for full semantics. Mutually exclusive with `auth_header`
# # and `oauth_dcr`.
# # [mcps.oauth]
# # client_id = "your-client-id"
# # client_secret = "your-client-secret"
# # token_endpoint = "https://idp.example.com/oauth/token"
# # scopes = ["read", "write"]   # optional, space-joined into `scope` form field
#
# # --- MCP OAuth 2.1 (discovery + Dynamic Client Registration + browser consent) ---
# # For servers following the MCP authorization spec (e.g. hosted Jira MCP).
# # Setup is two steps:  1) configure the block below,  2) run once interactively:
# #     jyc mcp auth <name>     # prints URL -> approve in browser -> paste redirect URL back
# # Afterwards `jyc serve` loads the stored tokens and refreshes them
# # automatically at every MCP connect — no further interaction until the
# # refresh token itself expires (then re-run the command). Credentials are
# # stored at <data-home>/jyc/mcp_auth/<name>.json (0600).
# # Mutually exclusive with `auth_header` and `oauth`.
# # [mcps.oauth_dcr]
# # scopes = ["jira.read"]       # optional; default auto-selects from the
# #                              # authorization server's published metadata
# # redirect_uri = "http://localhost:19876/callback"  # optional override;
# #                              # paste-back flow — nothing listens on it
# # Note: OAuth discovery (+ token refresh when near expiry) runs inside this
# # server's `timeout_ms` budget — raise it above the 10 s default for slow IdPs.
#
# # --- Per-Pattern MCP Configuration ---
# # You can also configure MCP servers per pattern, overriding the global `[[mcps]]`
# # list for topics matching that pattern. This allows different patterns to use
# # different tools, credentials, and remote endpoints.
# #
# # When a pattern has `mcps` set, only those MCP servers are loaded for topics
# # matching that pattern. When `mcps` is not set (default), the global `[[mcps]]`
# # list is used for backward compatibility. Set `mcps = []` to disable all MCP
# # tools for a specific pattern.
# #
# # Example — see the GitHub channel patterns section below for a complete example.

# --- Channel: Gitee Repository ---
# Enables multi-agent workflow on Gitee issues and PRs.
# Pipe-only adapter: the poller matches patterns and re-targets each event
# into an agent channel / agent topic; a reply forwarder posts agent replies
# back as issue/PR comments. State (dedup/cursor) lives under
# <data dir>/channels/<channel>/.gitee/. Topic initialization is a skill
# (gitee-init), not a per-pattern template.
# Uses Gitee API v5 for polling and comment posting.

# [channels.my_gitee]
# type = "gitee"
#
# [channels.my_gitee.gitee]
# owner = "myuser"
# repo = "myproject"
# token = "${GITEE_TOKEN}"              # Personal Access Token
# poll_interval_secs = 60
# # api_url = "https://gitee.com/api/v5"  # Default. For Gitee Enterprise, use custom URL
# # (Pipe-only: no footer — comments are plain agent text via the reply
# # forwarder, so [channels.<name>.footer] does not apply.)
#
# # Pattern: Issues → Planner
# [[channels.my_gitee.patterns]]
# name = "planner"
# enabled = true
# role = "Planner"
#
# [channels.my_gitee.patterns.rules]
# github_type = ["issue"]
#
# [channels.my_gitee.patterns.pipe]
# agent = "jyc_git"
# topic = "plan-${msg.issue_number}"
#
# # Pattern: Pull Requests with 'ready-for-dev' label → Developer
# [[channels.my_gitee.patterns]]
# name = "developer"
# enabled = true
# role = "Developer"
#
# [channels.my_gitee.patterns.rules]
# github_type = ["pull_request"]
# labels = ["ready-for-dev"]
#
# [channels.my_gitee.patterns.pipe]
# agent = "jyc_git"
# topic = "dev-${msg.pr_number}"
#
# # Pattern: Pull Requests with 'ready-for-review' label → Reviewer
# # NOTE: no `gitee-reviewer` skill ships yet (only gitee-init / gitee-planner /
# # gitee-developer are ported); the topic is created but the agent has no
# # reviewer instructions until it is ported from templates/gitee-reviewer.
# [[channels.my_gitee.patterns]]
# name = "reviewer"
# enabled = true
# role = "Reviewer"
#
# [channels.my_gitee.patterns.rules]
# github_type = ["pull_request"]
# labels = ["ready-for-review"]
#
# [channels.my_gitee.patterns.pipe]
# agent = "jyc_git"
# topic = "review-${msg.pr_number}"

# --- Channel: GitHub Repository ---
# Enables multi-agent workflow on GitHub issues and PRs.
# Pipe-only adapter: the poller matches patterns and re-targets each event
# into an agent channel / agent topic; a reply forwarder posts agent replies
# back as issue/PR comments. State (dedup/cursor) lives under
# <data dir>/channels/<channel>/.github/. Topic initialization is a skill
# (github-init), not a per-pattern template.
# Uses GitHub REST API for polling and comment posting.

# [channels.my_repo]
# type = "github"
#
# [channels.my_repo.github]
# owner = "myorg"
# repo = "myrepo"
# token = "${GITHUB_TOKEN}"           # PAT scopes: repo, read:user
# poll_interval_secs = 60
# # api_url = "https://api.github.com"  # Default. For GitHub Enterprise, use: https://github.example.com/api/v3
# # (Pipe-only: no footer — comments are plain agent text via the reply
# # forwarder, so [channels.<name>.footer] does not apply.)
#
# # Pattern: Issues with 'feature-plan' label → High-Level Planner
# [[channels.my_repo.patterns]]
# name = "high-level-planner"
# enabled = true
# role = "High-Level Planner"
#
# [channels.my_repo.patterns.rules]
# github_type = ["issue"]
# labels = ["feature-plan"]
#
# [channels.my_repo.patterns.pipe]
# agent = "jyc_git"
# topic = "plan-${msg.issue_number}"
#
# # Pattern: Issues without 'feature-plan' label → Detail-Level Planner
# # The exclude_labels rule ensures this pattern does NOT fire while High-Level Planner is active.
# [[channels.my_repo.patterns]]
# name = "detail-planner"
# enabled = true
# role = "Planner"
#
# [channels.my_repo.patterns.rules]
# github_type = ["issue"]
# exclude_labels = ["feature-plan"]
#
# [channels.my_repo.patterns.pipe]
# agent = "jyc_git"
# topic = "plan-${msg.issue_number}"
#
# # Pattern: PRs with 'ready-for-dev' label → Developer agent (auto-trigger)
# [[channels.my_repo.patterns]]
# name = "developer"
# enabled = true
# role = "Developer"
#
# [channels.my_repo.patterns.rules]
# github_type = ["pull_request"]
# labels = ["ready-for-dev"]
#
# [channels.my_repo.patterns.pipe]
# agent = "jyc_git"
# topic = "dev-${msg.pr_number}"
#
# # Pattern: PRs assigned to specific team members → Route to those assignees
# # Assignee matching: OR logic (matches if ANY assignee is in the list)
# [[channels.my_repo.patterns]]
# name = "assignee_routing"
# enabled = true
# role = "Developer"
#
# [channels.my_repo.patterns.rules]
# github_type = ["pull_request"]
# assignees = ["alice", "bob"]
#
# [channels.my_repo.patterns.pipe]
# agent = "jyc_git"
# topic = "dev-${msg.pr_number}"
#
# # --- MCP Examples ---
# # MCPs belong to the agent that handles the message: declare them under
# # [agents.<name>], or per topic in that topic's `.jyc/config.toml`. A pipe
# # channel's pattern cannot carry them.
# #
# # [agents.jyc_git]
# # # Local MCP
# # [[agents.jyc_git.mcps]]
# # name = "invoice"
# # type = "local"
# # command = ["invoice", "mcp"]
# #
# # # Remote MCP with Bearer token authentication
# # [[agents.jyc_git.mcps]]
# # name = "code-review-mcp"
# # type = "remote"
# # url = "https://review.example.com/mcp"
# # enabled = true
# # auth_header = "sk-xxx-review-token"
# #
# # # Remote MCP with custom headers
# # [agents.jyc_git.mcps.custom_headers]
# # "X-API-Key" = "abc123"
# # "X-Organization" = "my-org"
# #
# # Agent-level MCPs are loaded for all topics of the agent.
# # [[agents.my_hub.mcps]]
# # name = "kf_helper"
# # type = "local"
# # command = ["kf-helper", "mcp"]
# #
# # No MCP tools at all (empty mcps list)
# # [agents.simple_reply]
# # mcps = []
# #
# # --- Tool Exclusion Examples ---
# # Disable specific tools or entire MCP servers at agent level.
# #
# # [agents.my_hub]
# # # Disable proactive messaging for all topics of this agent
# # disabled_tools = ["jyc_send_message"]
# #
# # # Disable entire MCP servers
# # disabled_mcps = ["invoice"]
# #
# # # Backward-compatible alias (merged with disabled_tools)
# # disabled_builtin_tools = ["bash"]
#
# # --- Channel: my_wecom_bot ---
# # WeCom (企业微信) channel using the external contact API for outbound messaging.
# # Receives messages via webhook callback (/webhook/{channel_name}) and
# # sends replies via the WeCom External Contact API with access_token auth.
# #
# # Prerequisites:
# # 1. Create an app in WeCom and configure the callback URL
# #    (e.g., https://your-domain.com/webhook/my_wecom_bot)
# # 2. Get the token, encoding_aes_key, and corp_id from WeCom callback settings
# # 3. Get the corp_secret from WeCom app management
# #
# # Global HTTP server config (shared by all wecom channels). Bound by the
# # `jyc-pipe` process, which hosts wecom/wecomkf:
# [wecom]
# bind_addr = "127.0.0.1:10001"
#
# [channels.my_wecom_bot]
# type = "wecom"
#
# [channels.my_wecom_bot.wecom]
# token = "your_wecom_token"
# encoding_aes_key = "your_encoding_aes_key_43bytes"
# corp_id = "ww1234567890abcdef"
# corp_secret = "${WECOM_CORP_SECRET}"
#
# # wecom is a pipe-only channel: every pattern must name a pipe target.
# # Messages are routed into the agent channel; replies are relayed back to
# # the chat group. Useful ${msg.<key>} placeholders for pipe.topic:
# #   ${msg.chat_id} — group chat id; ${msg.from_user} — sender user id
# [[channels.my_wecom_bot.patterns]]
# name = "wecom_bot"
# pipe = { agent = "assistant", topic = "wecom_${msg.chat_id}" }
#
# [channels.my_wecom_bot.patterns.rules]
# # keywords = ["help", "问题"]

# # --- Channel: my_wecomkf_bot ---
# # WeCom KF (Customer Service) channel.
# # Uses the WeCom Customer Service API (kf/sync_msg, kf/send_msg)
# # for inbound message pulling and outbound message sending.
# #
# # Unlike the regular wecom channel (external contact API), the KF channel:
# # - Receives kf_msg_or_event notifications via the shared webhook server
# # - Pulls messages via kf/sync_msg API (cursor-based incremental sync)
# # - Sends replies via kf/send_msg API
# # - One topic per customer per KF account
# #   ({channel_name}_{open_kfid}_{external_userid})
# #
# # Prerequisites:
# # 1. Enable WeCom KF and configure callback URL
# # 2. Get the token, encoding_aes_key, and corp_id from KF callback settings
# # 3. Get the corp_secret from WeCom app management
# # 4. Note the open_kfid(s) for the KF accounts
# #
# # Reuses the shared WeCom webhook server (configured in [wecom] above,
# # bound by the `jyc-pipe` process — run it or callbacks are not received):
# # [wecom]
# # bind_addr = "127.0.0.1:10001"
# #
# # [channels.my_wecomkf_bot]
# # type = "wecomkf"
# #
# # [channels.my_wecomkf_bot.wecom_kf]
# # token = "your_kf_token"
# # encoding_aes_key = "your_encoding_aes_key_43bytes"
# # corp_id = "ww1234567890abcdef"
# # corp_secret = "${WECOM_CORP_SECRET}"
# # # Optional: filter by KF account IDs (empty = accept all)
# # open_kf_ids = ["kf1234567890"]
# # # Optional: cursor persistence file path (JSON)
# # # If not set, cursors are memory-only (lost on restart)
# # cursor_store_path = "./data/kf_cursors.json"
# # # Maximum age (seconds) of messages to process. Older messages are skipped.
# # # On first sync (empty cursor), only the latest message is processed regardless.
# # # Default: 300 (5 minutes). Set to 0 to disable age filtering.
# # # max_message_age_seconds = 300
# #
# # # wecomkf is a pipe-only channel: every pattern must name a pipe
# # # target. One topic per customer per KF account via placeholders:
# # #   ${msg.open_kfid} — KF account; ${msg.external_userid} — customer;
# # #   ${msg.user_name} — customer display name (when available)
# # # Replies are relayed via kf/send_msg (text only; attachments are
# # # not relayed).
# # [[channels.my_wecomkf_bot.patterns]]
# # name = "kf_bot"
# # pipe = { agent = "assistant", topic = "${msg.open_kfid}_${msg.external_userid}" }
# #
# # [channels.my_wecomkf_bot.patterns.rules]
# # # keywords = ["help", "support", "问题"]

# --- Channel: WeCom Smart Robot (wecom_bot) ---
#
# Pipe-only adapter (same shape as feishu). The protocol layer keeps
# the WebSocket connection and forwards inbound messages to an agent's websocket channel (websocket or synthesized agents channel); the agent
# produces the reply, which the adapter relays back via the WebSocket
# streaming reply (`aibot_respond_msg` + `msgtype: stream`,
# `finish=false` on receipt, `finish=true` on reply). Outbound
# attachments are relayed via proactive `aibot_send_msg`.
#
# Use `${msg.<key>}` placeholders in `pipe.topic` to scope topics per
# conversation. Useful keys:
#   - `${msg.chatid}`    — group chat id (group chats only)
#   - `${msg.userid}`    — sender user id (single chats only)
#   - `${msg.channel_uid}` — group chatid (group) or userid (single);
#                            unifies both in one template
#   - `${msg.chat_name}` — any metadata key (e.g. feishu-style chat name)
#
# Every enabled pattern must have a `pipe` — a pattern without one
# drops the message with a warning at runtime.
#
# [channels.my_wecom_bot]
# type = "wecom_bot"
#
# [channels.my_wecom_bot.wecom_bot]
# bot_id = "your_bot_id"
# secret = "${WECOM_BOT_SECRET}"
# # Optional: WebSocket URL (default: wss://openws.work.weixin.qq.com)
# # ws_url = "wss://openws.work.weixin.qq.com"
# # Optional: heartbeat interval in seconds (default: 30)
# # heartbeat_interval_secs = 30
# # Optional: reconnect delay in seconds (default: 5)
# # reconnect_delay_secs = 5
# # Optional: max reconnect attempts (default: 10)
# # max_reconnect_attempts = 10
# # Optional: auto reconnect (default: true)
# # auto_reconnect = true
#
# [[channels.my_wecom_bot.patterns]]
# name = "bot_all"
# enabled = true
# # Reach the agent named `jin`; one agent topic per group chat.
# pipe = { agent = "jin", topic = "bot-${msg.channel_uid}" }
#
# [channels.my_wecom_bot.patterns.rules]
# # keywords = ["help", "bot"]
# # sender = { exact = ["userid_xxx"] }   # optional: whitelist senders

# --- Agents ---
#
# An agent is a websocket-based endpoint with behavior but no matching
# rules. Each [agents.<name>] entry synthesizes a channel of
# channel_type = "websocket" with one implicit pattern whose name equals
# the agent name. WebSocket mechanism (broadcast, dashboard chat pane,
# /ws/agents/<topic> URL) stays the same.
#
# Default working directory: <data dir>/agents/<agent_name>/.data/
# (Linux/macOS: ~/.local/share/jyc/agents/<agent_name>/.data/
#  Windows:     %LOCALAPPDATA%\jyc\agents\<agent_name>\.data\
# `<agent_name>/` is that topic's home: `.data` is the directory the agent
# works in, `.jyc` beside it holds its state. A topic that predates this layout
# keeps the directory it was created with.
# Override with topic_path. A pinned topic's runtime state (.jyc) is NOT
# left in the pinned dir: it is adopted to <data dir>/agents/<name>/
# automatically on first start (existing .jyc is moved out of the repo).
# Ad-hoc pins without an agent key (e.g. dashboard `jyc open -p`) derive a
# unique folder name from the absolute path: /home/u/proj -> agents/_home_u_proj
# (underscores in the path are doubled, so the mapping cannot collide).
#
# Inheritance: an agent can reuse another agent's config with
#   extends = "<base_agent_name>"
# Child fields override the base field-by-field; lists (skills, mcps,
# disabled_tools, ...) are replaced wholesale (not merged); chains resolve
# recursively (A extends B extends C). Set a string field to "" to clear
# an inherited value (e.g. topic_path = "" falls back to the default
# workspace root); the "" marker applies recursively, so "" inside a
# nested table (e.g. context_strategy = { mode = "" }) clears that field
# too. Lists have no "unset" marker — skills = [] replaces the list with
# an empty whitelist (load no skills), which is also what an agent with no
# `skills` gets: skills are opt-in. The base agent stays usable itself.
#
# [agents.base_planner]
# role = "Planner"
# skills = ["plan-solution", "coding-principles"]
# model = "deepseek/deepseek-v4-pro"
# live_injection = false
#
# [agents.jyc]
# extends = "base_planner"   # inherit role/skills/model from base_planner
# # role = "Developer"       # override any inherited field
# # skills = []              # replace with an empty whitelist: load no skills
# template = "jyc"
# # topic_path = "~/projects/jyc"
# access = { read = ["~/.cargo/registry/src"], write = ["/tmp/jyc-builds"] }
# small_model = "deepseek/deepseek-v4-flash"
# mcps = []
# disabled_tools = []
# live_injection = true
# inject_inbound_images = false
# mode = "build"
# window / extend_rate: the sliding window keeps `window` turns after a
# slide and may grow to window + round(extend_rate * window) before it
# slides back (defaults 10 and 0.5).
# History is text-only: only the current turn carries tool calls and
# results. See `[ai].context_strategy` above for the full field list.
# context_strategy = { mode = "sliding_window", window = 10, extend_rate = 0.5 }
# attachments = { enabled = true, allowed_extensions = [".pdf", ".md"] }
#
# --- Per-agent `[[commands]]` ---
#
# Each agent can declare its own slash commands, scoped to topics routed
# to that agent. Registered into the per-topic `CommandRegistry` in
# addition to (not instead of) the top-level `[[commands]]`, so a
# per-agent `/foo` only fires when the topic is routed to that agent.
# Useful for agent-specific workflows that don't belong in every
# other agent's prompt.
#
# Within one agent, names must be unique. Same names across scopes
# (global vs this agent, this agent vs another agent) are allowed —
# at runtime, `CommandRegistry::register` overwrites on collision with
# a `tracing::warn`, so a per-agent command with the same name as a
# global one wins for that agent's topics. Validation does NOT flag
# cross-scope name reuse.
#
# [agents.jin]
# [[agents.jin.commands]]
# name = "design-doc"
# description = "Draft a design doc for the current task."
# user_prompt = "Draft a design doc covering motivation, design, trade-offs, and rollback for the current task."
#
# [[agents.jin.commands]]
# name = "lint"
# description = "Run clippy with the project's strict settings."
# shell = ["sh", "-c", "cargo clippy --workspace --all-targets -- -D warnings"]
#
# When `/lint` is typed in a topic routed to jin, it runs the shell
# command directly (no LLM, no tokens). In any other topic, `/lint`
# is unknown unless defined globally or under that other agent.

# --- Channel: WebSocket (REMOVED) ---
#
# The pre-agents form — an explicit `[channels.<name>]` with
# type = "websocket" — is gone: channels are forwarders owned by the pipe
# process, and the only hub-side websocket channel is the "agents" channel
# synthesized from `[agents.<name>]`. Config validation rejects it.

# --- Per-Topic MCP Overrides (L3) ---
#
# Place a `config.toml` in the topic's state dir — `<home>/.jyc/config.toml`,
# e.g. `<data dir>/agents/<name>/.jyc/config.toml` for an agent-keyed topic or
# `<data dir>/agents/<agent>/<topic>/.jyc/config.toml` for a pipe topic — to add or
# replace MCPs for a
# specific topic (e.g. one GitHub PR, one WeCom conversation). Layered on
# top of the pattern → channel → global chain. The same `[ai] model`
# overrides also live here.
#
# Default merge = ADDITIVE: topic MCPs union with the inherited set.
# Same `name` → topic version wins (last-writer-wins on the union).
#
# Opt-in REPLACE: set `mcps_replace = true` to fully drop the inherited
# MCPs and use only the topic's MCP list. Useful when a topic should
# be isolated from the pattern's tools.
#
# The same file also carries the settings a topic sets for *itself*, each one
# above the pattern/channel layers and below the runtime override files
# (`.jyc/<mode>-model-override`, `.jyc/mode-override`, `/skill`, `/mcp`):
#
#   mode            = "plan"            # starting mode (a config layer, not /mode)
#   skills          = ["pr-review"]     # allow-list: replaces the pattern's
#   disabled_tools  = ["write", "bash"] # unioned with channel/pattern
#   instructions    = "..."             # extra system-prompt section
#
# Example topic config:
#
#   # /<topic>/.jyc/config.toml
#
#   [ai]
#   model = "anthropic/claude-opus-4-7"
#
#   # Context management for this topic only. Same layer as `mode`: above the
#   # pattern/channel/global `[ai].context_strategy`, below the runtime
#   # `.jyc/context-strategy.json` that `/context` writes. A subagent type
#   # carries one the same way — that is how a role starts with a small window
#   # (see `subagents/ci-watch/config.toml`: window = 1, extend_rate = 0.0,
#   # turn_tool_result_cap = 512).
#   # [context_strategy]
#   # mode = "sliding_window"
#   # window = 3
#   # extend_rate = 0        # 0 = hard window: slide on every turn
#   # max_history_tokens = 40000  # second slide trigger, at the top of a cycle
#   # turn_tool_result_cap   # unset = current turn uncapped; 0 = off
#
#   # Default: additive. Adds a topic-only MCP without dropping inherited ones.
#   [[mcps]]
#   name = "topic-local"
#   type = "local"
#   command = ["./local-mcp"]
#
#   # Opt-in: full replace. Drop all inherited MCPs.
#   # mcps_replace = true
#
#   # [[mcps]]
#   # name = "totally-different"
#   # type = "remote"
#   # url = "https://example.com/mcp"
#
# Note: parse errors in this file are logged at runtime and ignored
# (a broken topic config must not crash the agent). After starting
# `jyc serve`, check logs for `Ignoring invalid topic config`
# warnings to confirm parsing succeeded. Semantic issues (e.g. bad
# MCP command path) still surface at MCP-load time as normal errors.

# --- Subagent Types ---
#
# A subagent type is a named role: a topic config a spawn hands to its child.
# `jyc_spawn_subagent(type = "review")` (or `/spawn review`) writes the
# type's settings into the child's own `.jyc/config.toml` at spawn time, so the
# child starts with that model, skill allow-list, disabled tools, mode and
# instructions instead of whatever the parent happened to be running with.
#
# A type is defined in either place — a type in both merges key by key, and the
# `[subagents.<type>]` table wins:
#
#   1. `[subagents.<type>]` below (this file), or
#   2. `<config dir>/subagents/<type>/config.toml` — an installed preset, the
#      same "one directory per entry" shape as `skills/` and `templates/`. Only
#      the config dir is scanned: unlike skills, a type is not layered, so
#      `{data dir}/subagents/` is not a source.
#
# The second form is a plain topic config (the L3 shape above, `mode` included),
# so a type can be copied straight into a topic's `.jyc/config.toml` and back —
# plus two keys only an installed type has, both aimed at the agent *choosing* a
# role: `description` (one line of "when to spawn me", listed beside the name in
# the `jyc_spawn_subagent` tool's `type` argument) and `[spawn]` (the role's own
# defaults for `inherit_context` / `share_topic_path`, overridden by an explicit
# argument at spawn time). The inline `[subagents.<type>]` form below has no
# place for either: it is a topic config.
# A type name is a directory component: letters, digits, `-`, `_`, `.`, `:`,
# spaces; no `/`, no leading `.`, no `..`.
#
# What a type is *not*: it does not change where the child works (its own
# `topic_path` by default, see `share_topic_path`), and it is not a cage — the
# child's own `/mode`, `/model` and `/skill` still win over it afterwards. The
# parent's runtime overrides are dropped when a type is applied (they outrank a
# topic config in every chain, so inheriting them would silently undo the role).
#
# A second shipped role is the CI watcher, `subagents/ci-watch/config.toml`
# (`cp -r subagents/ci-watch <config dir>/subagents/`): plan mode, the small
# model, no `write`/`edit`, a `[context_strategy]` small enough that a polled
# `gh` output cannot pile up, and instructions to report the PR's checks
# without diagnosing it. A parent hands it a wait it does not want to hold its
# own turn for (see the `dev-workflow` skill).
#
# A third shipped role is the developer, `subagents/develop/config.toml`
# (`cp -r subagents/develop <config dir>/subagents/`): build mode, `dev-workflow`
# as its whole allow-list, and *no* `disabled_tools` — this is the role that has
# to write files, run the gate and delegate its own `review` / `ci-watch`
# children. Its directory is its own, and the caller is who prepares it (a
# `git worktree` here) and removes it afterwards (see the `delegated-dev` skill).
#
# Example: a reviewer that can read but not change anything. This is the role
# the jyc repo ships at `subagents/review/config.toml` (install it with
# `cp -r subagents/review <config dir>/subagents/`; see the `dev-workflow`
# skill). `write` and `edit` are gone; `bash` is kept because a review of a
# branch needs `git status`, `git diff <base>..HEAD` and `git log`, and there is
# no read-only shell — plan mode and the instructions below are what restrain it.
#
# [subagents.review]
# mode = "plan"
# skills = ["pr-review", "ponytail-review", "coding-principles", "ponytail"]
# disabled_tools = ["write", "edit", "jyc_spawn_subagent"]
# instructions = """
# You are the reviewer for this delegation: read, verify, report. Change no file.
# """
#
# The same type as an installed preset — this is the file the jyc repo ships
# (`subagents/review/config.toml`), which is the whole of it:
#
#   <config dir>/subagents/review/config.toml
#
#   description = "Reviews a change before you push or open a PR: reads the diff and the tree as they are, changes no file, reports findings with a severity."
#   [spawn]
#   share_topic_path = true   # review the tree as it is, not a copy of it
#   mode = "plan"
#   skills = ["pr-review", "ponytail-review", "coding-principles", "ponytail"]
#   disabled_tools = ["write", "edit", "jyc_spawn_subagent"]
#   instructions = "…"   # report-only standing orders, see the file itself


